name: release

# Guards a version tag (v*.*.*) push. This repo's releases always carry
# curated notes (tasks/tag-and-release.md's outline), published directly via
# `gh release create --target <sha> --notes-file <file>`, which mints the tag
# and the release together in one call and makes this workflow's own run a
# no-op. Single ubuntu job by design: the guard is platform-independent, unlike
# install.yml's mirrored unix/windows assertions. Tag only commits already
# green on main; the first guard refuses to pass a commit the installer smoke
# test hasn't passed. The second guard fails if a tag lands with no release
# attached (a bare `git push --tags` ahead of the notes, or notes creation
# skipped), rather than silently generating a bare PR-title changelog in its
# place. Either guard failing just means: finish the documented process for
# this tag (wait for install.yml to go green, or publish the release via
# `gh release create --notes-file`), then re-run this workflow from the
# Actions tab.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert the tagged commit passed the installer smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh run list --commit "$sha" --workflow install.yml --branch main \
            --json conclusion --jq '.[0].conclusion // empty')"
          [ "$conclusion" = "success" ] || {
            echo "FAIL: installer smoke test is not green for $sha (got: ${conclusion:-no run})"
            echo "Wait for install.yml to pass on this commit, then re-run this workflow."
            exit 1
          }
      - name: Assert a release with curated notes exists for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists -- nothing to do"
            exit 0
          fi
          echo "FAIL: no release exists yet for $GITHUB_REF_NAME."
          echo "This repo always publishes curated notes (tasks/tag-and-release.md);"
          echo "run that process, then 'gh release create $GITHUB_REF_NAME --notes-file <file>'."
          exit 1
