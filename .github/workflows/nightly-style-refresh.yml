name: nightly style refresh

# Runs unattended nightly against main: a headless Claude Code session
# re-runs /inherit-legacy-style then /copilot-review-instructions (see
# skills/inherit-legacy-style and skills/copilot-review-instructions), a
# mechanical step opens a PR if either produced drift, requests a GitHub
# Copilot review, a second headless session triages findings, edits
# files, and drafts a per-thread reply for each finding, a mechanical
# step commits that fix and comments on the PR, a mechanical step posts
# those replies and resolves every review thread and waits for the PR's
# required checks, then a mechanical step squash-merges behind a
# diff-allowlist guard.
#
# Two tokens are in play. The GH_TOKEN secret, a repo-scoped personal
# access token, is declared by name on every step that writes to GitHub:
# opening the PR, pushing the refresh commit and the review-fix commit,
# requesting the Copilot review, replying to and resolving review
# threads, and the squash-merge. That split exists because the org's
# workflow settings block the default GITHUB_TOKEN from creating pull
# requests, and because
# events performed with the default GITHUB_TOKEN don't trigger other
# workflow runs (workflow_dispatch and repository_dispatch are the only
# exceptions: https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow),
# which would starve the PR of the CI checks the merge step later waits
# on. The default token is kept on the two read-only steps (preflight,
# fetch-review) to minimize scope. Neither Claude session ever holds
# either token: each runs with --dangerously-skip-permissions but no
# ability to push, open a PR, or call the GitHub API, so prompt-injected
# repository content it reads can change files in the working tree but
# can't use `gh` or `git push` to touch anything else. What actually keeps
# both sessions credential-free is checkout's persist-credentials flag,
# set to false below, not the token scoping by itself: checkout's own
# default (persist-credentials: true) would otherwise configure the
# default token for git's use, stored in a file under $RUNNER_TEMP as of
# actions/checkout v6+ rather than in .git/config
# (https://github.com/actions/checkout#readme), reachable by both sessions
# regardless of which token any later step declares in its own env. A
# Claude session hands its output to the next mechanical step as a plain
# file under $RUNNER_TEMP (outside the git working tree, so it can never
# land in a commit) rather than acting on GitHub directly. The
# diff-allowlist guard -- the PR may only touch .ai-style-rules.md,
# .github/instructions/*.instructions.md, and .github/copilot-instructions.md
# -- is a second, independent
# backstop on top of that token scoping.
#
# Reply to and resolve Copilot review threads runs before the merge
# attempt because the main-branch ruleset requires every review thread
# formally resolved (the GraphQL resolveReviewThread mutation), not just
# replied to. Within that step, replies are posted first, from session
# 2's thread-replies.json, so each thread carries the triage verdict a
# human can read before it collapses as resolved (interactive sessions
# leave the same trail by hand). That step then refuses to resolve any
# thread it has no reply for. This reverses an earlier decision that a
# missing or malformed replies file should degrade to resolve-only rather
# than block the merge path; PR #129 showed the premise was wrong. An
# absent reply is indistinguishable from a finding session 2 never
# received, and since thread resolution is the only thing the ruleset
# checks, treating that ambiguity as benign turned a delivery bug into a
# merged PR carrying four unaddressed findings. The safe reading is the
# pessimistic one, so an uncovered thread now fails the run red and
# leaves the PR open. A reply whose POST fails is still resolved: the
# file already proves session 2 triaged the finding, and the fixes are
# pushed by then, so only the visible trail is missing. Wait for
# required checks runs after the guard and before the merge because the
# review-fix push emits its own pull_request: synchronize event, which
# re-triggers CI on the new head SHA, and the merge step must not race
# ahead of that run finishing.
#
# Permission mode: sessions run with --dangerously-skip-permissions (fully
# unattended, no human to approve tool calls). Anthropic's own docs recommend
# `dontAsk` mode plus an explicit allowlist for CI instead
# (https://code.claude.com/docs/en/permission-modes), and warn that
# bypassPermissions "offers no protection against prompt injection or
# unintended actions." Bypass is used here anyway because it was explicitly
# requested; the token-scoping and diff-allowlist guard above are the actual
# backstops, independent of permission mode.
#
# Review-wait is a bounded poll loop in this same job (not a second
# pull_request_review-triggered workflow): a PR opened with the default
# GITHUB_TOKEN doesn't trigger other workflow runs, so an event-driven split
# would silently never fire. It requires proof that the captured PR head has
# both a Copilot review and a completed, successful Actions-backed full
# agentic review, then confirms the PR head did not advance after that proof.
# If the poll step fails (no such proof within 15 minutes), the run goes red
# and the PR is left open for a human -- that is the intended degrade path,
# not a bug.
#
# install.sh wires this repo's own PreToolUse hooks into the runner's
# ~/.claude/settings.json; PLANGATE_DISABLED and GATEGUARD_DISABLED are set
# for every Claude step below because both hooks are designed to block an
# unattended session (plan-gate expects a plan-and-track Skill invocation
# that never happens headlessly; gateguard expects a human retry).
#
# A stuck PR from a prior night (poll timeout, or a run that failed after
# opening the PR) makes the next night's preflight step skip entirely until
# a human closes or merges it.
#
# Two checkpoints track different things. .ai-style-rules.md's own commit
# fingerprint only advances when /inherit-legacy-style finds real convention
# drift to record, so a commit that touches source but produces none (a
# typo fix, a version bump) leaves it stuck behind that commit indefinitely.
# NIGHTLY_STYLE_LAST_CHECKED_SHA, a GitHub Actions repository variable, tracks
# something narrower instead: the last commit this run actually examined --
# the checked-out HEAD on a quiet night, or the bot's own squash-merge commit
# when this run found drift and merged a PR -- never main's live tip, since
# an unrelated commit landing on main while this run is still executing was
# never examined by it and reading the tip live would wrongly mark it
# checked. Preflight skips only when HEAD matches it exactly, so a quiet
# night with nothing new needs no commit-range math or path exclusions --
# and it lives outside git history because the main-branch ruleset requires
# a PR for every change, including a checkpoint-only bump, and opening one
# every quiet night would be worse than the problem it fixes.

on:
  schedule:
    - cron: "43 5 * * *" # off-peak minute; GitHub delays exact top-of-hour crons
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: nightly-style-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.repository == 'blineadam/agent-plan-and-track'
    timeout-minutes: 60
    env:
      BRANCH: bot/style-refresh-${{ github.run_id }}
      CLAUDE_CODE_VERSION: "2.1.214"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # inherit-legacy-style diffs recorded-fingerprint..HEAD; shallow breaks that
          persist-credentials: false

      - name: Preflight -- skip if a prior nightly PR is still open, or nothing changed
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          open="$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("bot/style-refresh-"))] | length')"
          if [ "$open" != "0" ]; then
            echo "a prior nightly PR is still open; skipping"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          checkpoint="${{ vars.NIGHTLY_STYLE_LAST_CHECKED_SHA }}"
          head="$(git rev-parse HEAD)"
          if [ "$head" = "$checkpoint" ]; then
            echo "HEAD $head already examined (matches checkpoint); skipping"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI
        if: steps.preflight.outputs.skip == '0'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Deploy repo skills and hooks to the runner's HOME
        if: steps.preflight.outputs.skip == '0'
        run: ./install.sh all

      - name: Configure git identity
        if: steps.preflight.outputs.skip == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh style artifacts (Claude session 1)
        if: steps.preflight.outputs.skip == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLANGATE_DISABLED: "1"
          GATEGUARD_DISABLED: "1"
        run: |
          set -euo pipefail
          claude -p --dangerously-skip-permissions "You are running unattended in CI on a fresh checkout of main. No user is available: never ask a question or wait for input, and never invent an answer to a question you'd normally ask a user -- defer it instead as described below. You have no GitHub token: don't run git or gh commands, and don't try to.

          Run /inherit-legacy-style. It will detect incremental-update mode itself. If a strong-signal conflict would normally trigger its one-question-at-a-time protocol, do not guess: leave that convention uncaptured and note it as a 'Deferred conflict:' bullet you'll include in the PR body's '## Summary' section below. Decline its offer to add soft/hard persistence wiring (this repo already references .ai-style-rules.md from AGENTS.md). If it offers to invoke /copilot-review-instructions, accept; otherwise run /copilot-review-instructions yourself afterward -- both of its preconditions already hold in this repo.

          Hard boundary: only .ai-style-rules.md, .github/instructions/*.instructions.md, and .github/copilot-instructions.md may change. If anything else changed, revert it before finishing.

          If \`git status --porcelain\` is empty when both skills are done, print the single line NO_CHANGES and stop -- do not write a summary file.

          Otherwise, write a file at \"$RUNNER_TEMP/pr-summary.md\": its first line is a one-line PR title describing the change (no AI/tool self-attribution), then a blank line, then the PR body, structured as the two sections a style-artifact-only change needs (this repo's PR convention allows more, like '## Implementation', but a change confined to style artifacts doesn't need one). '## Summary': bullet points covering what actually drifted and why each change was captured, with a 'Deferred conflict:' bullet for anything deferred. '## Test plan': a markdown checklist of the verification that applies to a style-artifact-only change -- '- [x]' items for what already ran in this session (which skill or skills, and what they regenerated), '- [ ]' items for the gates later workflow steps apply (the diff-allowlist guard and the Copilot review). There is no test suite for this kind of change; do not claim one ran. No AI/tool self-attribution anywhere. Then stop -- a later step in this workflow handles committing, pushing, and opening the PR."

      - name: Commit changes and open a PR
        id: pr
        if: steps.preflight.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_pr=0" >> "$GITHUB_OUTPUT"
            echo "no changes from Claude session 1"
            exit 0
          fi
          summary="$RUNNER_TEMP/pr-summary.md"
          if [ ! -s "$summary" ]; then
            echo "session 1 left uncommitted changes but no summary file; aborting" >&2
            exit 1
          fi
          title="$(head -n1 "$summary")"
          git checkout -b "$BRANCH"
          git add -A -- .ai-style-rules.md .github/instructions .github/copilot-instructions.md
          git commit -m "$title"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "$title" --body-file <(tail -n +2 "$summary")
          number="$(gh pr view "$BRANCH" --json number --jq .number)"
          echo "has_pr=1" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Request Copilot review and wait for it
        if: steps.pr.outputs.has_pr == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          head_sha="$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq .head.sha)"
          gh api "repos/${{ github.repository }}/pulls/$pr/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'
          for i in $(seq 1 30); do
            matching_review="$(gh api --paginate "repos/${{ github.repository }}/pulls/$pr/reviews?per_page=100" \
              --jq ".[] | select(.user.login == \"copilot-pull-request-reviewer[bot]\" and .commit_id == \"$head_sha\") | .id" | jq -sc 'length')"
            successful_full_run="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$head_sha&event=dynamic&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_sha == \"$head_sha\" and .path == \"dynamic/agents/copilot-pull-request-reviewer\" and .status == \"completed\" and .conclusion == \"success\")] | length")"
            if [ "$matching_review" -gt 0 ] && [ "$successful_full_run" -gt 0 ]; then
              current_head="$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq .head.sha)"
              if [ "$current_head" != "$head_sha" ]; then
                echo "PR head advanced after full Copilot review proof; leaving PR #$pr open" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 30
          done
          echo "Full Copilot review proof did not land within 15 minutes; leaving PR #$pr open" >&2
          exit 1

      - name: Fetch Copilot's review for session 2
        if: steps.pr.outputs.has_pr == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          # Copilot's login is spelled differently on each API surface:
          # "copilot-pull-request-reviewer[bot]" on /reviews, plain "Copilot"
          # on /comments, and "copilot-pull-request-reviewer" on the GraphQL
          # thread author below. Matching /reviews' spelling against /comments
          # is what silently emptied this dump on PR #129 and let that run
          # resolve four findings session 2 never saw. So only /reviews is
          # filtered by login here; the comments are selected by which review
          # they belong to, an id rather than a name, so no spelling can drift
          # again. The surviving login filter is safe because the wait step
          # above matches the same string on the same endpoint and fails the
          # run red on timeout, so drift there stops the run before session 2
          # sees anything; keep those two in sync if either is edited.
          reviews="$(gh api --paginate "repos/${{ github.repository }}/pulls/$pr/reviews?per_page=100" \
            --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]")' | jq -sc '.')"
          review_ids="$(jq -c '[.[].id]' <<<"$reviews")"
          {
            echo "## Reviews"
            echo "$reviews"
            echo "## Review comments"
            gh api --paginate "repos/${{ github.repository }}/pulls/$pr/comments?per_page=100" \
              --jq ".[] | select(.pull_request_review_id as \$id | $review_ids | index(\$id))" | jq -sc '.'
          } > "$RUNNER_TEMP/copilot-review.json"

      - name: Address the review (Claude session 2)
        if: steps.pr.outputs.has_pr == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLANGATE_DISABLED: "1"
          GATEGUARD_DISABLED: "1"
        run: |
          set -euo pipefail
          claude -p --dangerously-skip-permissions "You are running unattended in CI, continuing work on branch $BRANCH (already checked out). No user is available: never ask a question or wait for input. You have no GitHub token: don't run git or gh commands, and don't try to.

          Read Copilot's completed review from the file \"$RUNNER_TEMP/copilot-review.json\" (already fetched: a JSON dump of the PR's reviews, then its review comments). Judge each finding against this repo's real conventions (.ai-style-rules.md, AGENTS.md, and whatever source the finding concerns), not generic style preference.

          Fix the valid findings by editing files directly. Hard boundary: only .ai-style-rules.md, .github/instructions/*.instructions.md, and .github/copilot-instructions.md may change.

          Write a file at \"$RUNNER_TEMP/thread-replies.json\": a JSON array with one entry per top-level Copilot review comment (the review-comments entries with no in_reply_to_id), each shaped {\"comment_id\": <that comment's numeric id field>, \"reply\": \"<one or two sentences stating your triage verdict: what you confirmed and changed, or why you deferred it>\"}. Where a reply refers to the commit containing your fixes, write the literal placeholder {FIX_COMMIT}; a later step substitutes the real short SHA after committing. Each reply is posted verbatim onto its review thread before the thread is resolved, so a human reading the PR sees the reasoning.

          Also write a file at \"$RUNNER_TEMP/deferred-findings.md\" listing each finding you did not act on, with a one-line reason (leave the file empty, or don't create it, if you acted on everything). Then stop -- a later step in this workflow handles committing, pushing, and commenting on the PR."

      - name: Commit the review fix and comment on the PR
        if: steps.pr.outputs.has_pr == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git add -A -- .ai-style-rules.md .github/instructions .github/copilot-instructions.md
            git commit -m "Address Copilot review feedback on PR #$PR_NUMBER"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          fi
          deferred="$RUNNER_TEMP/deferred-findings.md"
          if [ -s "$deferred" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$deferred"
          fi

      - name: Reply to and resolve Copilot review threads
        if: steps.pr.outputs.has_pr == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          # Post session 2's per-thread replies first, so each thread carries
          # the triage verdict before it collapses as resolved. A missing or
          # malformed file degrades to posting nothing here, but it does not
          # let the run resolve anything: the coverage check below still has
          # to pass, and with no replies it cannot.
          replies="$RUNNER_TEMP/thread-replies.json"
          if jq -e 'type == "array"' "$replies" >/dev/null 2>&1; then
            sha="$(git rev-parse --short HEAD)"
            jq -c '.[]' "$replies" | while IFS= read -r entry; do
              id="$(jq -r '.comment_id // empty' <<<"$entry" 2>/dev/null || true)"
              body="$(jq -r '.reply // empty' <<<"$entry" 2>/dev/null | sed "s/{FIX_COMMIT}/$sha/g" || true)"
              if [ -z "$id" ] || [ -z "$body" ]; then
                echo "skipping malformed reply entry" >&2
                continue
              fi
              gh api "repos/${{ github.repository }}/pulls/$pr/comments/$id/replies" \
                -f body="$body" >/dev/null \
                || echo "reply to comment $id failed; continuing" >&2
            done
          else
            echo "no valid thread-replies.json; the coverage check below will fail" >&2
          fi
          # Scoped to threads Copilot itself opened: resolving a thread a human
          # reviewer left while this unattended run was in flight would satisfy
          # the ruleset's required_review_thread_resolution rule without the
          # feedback ever having been addressed. A thread's first comment is
          # its top-level review comment, and that comment's databaseId is
          # exactly the REST numeric id session 2 emits as comment_id, so it
          # doubles as the join key for the coverage check below.
          # reviewThreads caps at 100 nodes per page, and a thread past the cap
          # is invisible to both the coverage check and the resolve loop below,
          # so it passes the check vacuously instead of failing it: the one
          # truncation on this path that waves a finding through rather than
          # stopping the run. --paginate drives $endCursor until hasNextPage is
          # false, and the per-page --jq emits one object per thread, so slurp
          # every page before anything filters or counts it.
          threads="$(gh api graphql --paginate \
            -f query='query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
              repository(owner: $owner, name: $repo) { pullRequest(number: $number) {
                reviewThreads(first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { id isResolved comments(first: 1) { nodes { databaseId author { login } } } } } } } }' \
            -f owner="${{ github.repository_owner }}" -f repo="${GITHUB_REPOSITORY#*/}" -F number="$pr" \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved | not) | select(.comments.nodes[0].author.login == "copilot-pull-request-reviewer") | {id, root: .comments.nodes[0].databaseId}' | jq -sc '.')"
          # Refuse to resolve a finding no one triaged. Resolution is the only
          # thing the ruleset checks before the merge, so resolving a thread
          # session 2 never saw silently converts a delivery bug into a merged
          # PR -- exactly what happened on #129, where an empty comment dump
          # produced no replies and all four threads were resolved anyway.
          # A reply in the file is the only evidence that a finding reached
          # session 2 at all, so require one per unresolved thread and leave
          # the PR open for a human otherwise. Zero unresolved threads passes
          # vacuously, keeping a clean-review night green.
          # The select mirrors the posting loop's own skip condition above, so
          # an entry it declined to post can never count as coverage here:
          # accepting one would resolve a thread carrying no reply at all,
          # which is the exact hole this check exists to close. tonumber then
          # tolerates session 2 emitting the id as a JSON string, since a type
          # mismatch would otherwise read as an uncovered thread and fail a
          # run whose findings were in fact triaged.
          replied='[]'
          if jq -e 'type == "array"' "$replies" >/dev/null 2>&1; then
            replied="$(jq -c '[.[] | select((.reply // "") | tostring | length > 0) | .comment_id | tonumber? // empty]' "$replies")"
          fi
          uncovered="$(jq -r --argjson replied "$replied" \
            '[.[] | select(.root as $root | $replied | index($root) | not) | .root] | join(" ")' <<<"$threads")"
          if [ -n "$uncovered" ]; then
            echo "no usable triage reply for review comment(s): $uncovered" >&2
            echo "candidate causes: the fetch delivered no comments, session 2 failed before writing its replies file, it wrote a partial or malformed one, or a later review opened threads it never saw" >&2
            echo "leaving PR #$pr open for a human" >&2
            exit 1
          fi
          for id in $(jq -r '.[].id' <<<"$threads"); do
            gh api graphql \
              -f query='mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }' \
              -f id="$id"
          done

      - name: Guard -- the PR only touches the style-artifact allowlist
        if: steps.pr.outputs.has_pr == '1'
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          bad="$(git diff --name-only "origin/main...origin/$BRANCH" \
            | grep -Ev '^(\.ai-style-rules\.md|\.github/instructions/[^/]+\.instructions\.md|\.github/copilot-instructions\.md)$' || true)"
          if [ -n "$bad" ]; then
            echo "PR touches files outside the style allowlist:" >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Guard -- the Copilot instructions file only changed inside its owned section
        if: steps.pr.outputs.has_pr == '1'
        run: |
          set -euo pipefail
          f=.github/copilot-instructions.md
          # The allowlist above is file-level, but copilot-review-instructions
          # owns only this file's `# Code reviews` section; the rest is
          # hand-authored and also steers Copilot's cloud agent. The checker
          # compares everything outside that section. Each side is written only
          # when it exists, so the checker can tell absent from empty.
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          git show "origin/main:$f" > "$d/base.md" 2>/dev/null || rm -f "$d/base.md"
          git show "origin/$BRANCH:$f" > "$d/head.md" 2>/dev/null || rm -f "$d/head.md"
          node .github/scripts/check-owned-section.js "$d/base.md" "$d/head.md"

      - name: Wait for required checks, then squash-merge and delete the branch
        if: steps.pr.outputs.has_pr == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          # This repo has no branch-protection-level required status checks
          # (`gh pr checks --required` errors "no required checks reported"
          # for every PR here; only the ruleset's thread-resolution and
          # code-scanning rules gate the merge). mergeStateStatus is GitHub's
          # own authoritative merge-readiness signal, so poll that instead of
          # guessing which checks are required. Per GitHub's GraphQL schema
          # (https://docs.github.com/en/graphql/reference/enums#mergestatestatus),
          # CLEAN means "mergeable and passing commit status" and UNSTABLE
          # means "mergeable with non-passing commit status" -- a check that's
          # merely pending (required or not) keeps the PR at UNSTABLE, not
          # CLEAN, so this loop already keeps polling until every check has
          # settled, not just the required ones. The explicit failed-check
          # check below is a belt-and-suspenders hard stop on top of that.
          #
          # The merge attempt lives inside this same loop, right after the
          # status looks CLEAN, instead of as a separate one-shot step after
          # the loop exits. mergeStateStatus is a poll snapshot, not a lock:
          # main can advance between the poll and a later merge call ("Head
          # branch is out of date"), and mergeStateStatus has also been
          # observed reporting CLEAN before this repo's ruleset actually
          # finished evaluating ("the base branch policy prohibits the
          # merge"). Both are transient races, not permanent failures, so on
          # either one this loop logs it and keeps polling/retrying rather
          # than failing the run; any other merge error is treated as real
          # and stops immediately. Each merge call is also pinned to the
          # runner's checked-out SHA, including any reviewed session-2
          # commit, so a remote head advance fails closed instead of merging
          # an unreviewed commit.
          for i in $(seq 1 80); do
            info="$(gh pr view "$pr" --json mergeStateStatus,statusCheckRollup)"
            merge_status="$(echo "$info" | jq -r '.mergeStateStatus')"
            failed="$(echo "$info" | jq -r '[.statusCheckRollup[]? | select((.conclusion // .state) as $c | $c == "FAILURE" or $c == "CANCELLED" or $c == "TIMED_OUT" or $c == "ERROR")] | length')"
            if [ "$failed" != "0" ]; then
              echo "a check on the PR head failed (mergeStateStatus=$merge_status)" >&2
              exit 1
            fi
            case "$merge_status" in
              CLEAN|HAS_HOOKS)
                expected_head="$(git rev-parse HEAD)"
                if merge_err="$(gh pr merge "$pr" --squash --delete-branch --match-head-commit "$expected_head" 2>&1)"; then
                  echo "$merge_err"
                  exit 0
                fi
                case "$merge_err" in
                  *"out of date"*|*"base branch policy prohibits"*)
                    echo "merge attempt hit a transient race, retrying: $merge_err" >&2 ;;
                  *)
                    echo "$merge_err" >&2; exit 1 ;;
                esac
                ;;
              DIRTY)
                echo "PR has merge conflicts (mergeStateStatus=$merge_status)" >&2; exit 1 ;;
              BEHIND)
                # Updating remotely would create a PR head the runner has not
                # checked out or reviewed, so leave it open for a human instead.
                echo "PR branch is behind base; leaving PR #$pr open" >&2; exit 1 ;;
              *) ;; # BLOCKED, UNSTABLE, UNKNOWN -- still settling, keep polling
            esac
            sleep 15
          done
          echo "PR did not reach a mergeable state within 20 minutes; leaving PR #$pr open" >&2
          exit 1

      - name: Advance the run checkpoint to the examined commit
        if: steps.preflight.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ steps.pr.outputs.has_pr }}" = "1" ]; then
            sha="$(gh pr view "${{ steps.pr.outputs.number }}" --json mergeCommit --jq .mergeCommit.oid)"
          else
            sha="${{ steps.preflight.outputs.head_sha }}"
          fi
          gh variable set NIGHTLY_STYLE_LAST_CHECKED_SHA --body "$sha"
