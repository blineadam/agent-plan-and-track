name: installer smoke test

# Verifies that both installers deploy a correct, idempotent file layout and that
# the shared Node scripts run on each platform. Out of scope (no harness CLI on
# the runners): whether Claude/Codex/Copilot actually load and fire the hooks at
# session time. That is the manual smoke test noted in tasks/todo.md Phase E.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tooling versions
        run: jq --version && node --version
      - name: Install twice (idempotent) into a scratch HOME
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home"; mkdir -p "$HOME"
          ./install.sh all
          out="$(./install.sh all)"
          echo "$out"
          echo "$out" | grep -q 'digest hook     -- already present' \
            || { echo "FAIL: digest hook not detected as already present on re-run"; exit 1; }
      - name: Assert layout, defaults, and hook wiring
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home"
          for f in \
            "$HOME/.claude/scripts/core-rules-digest.js" \
            "$HOME/.claude/scripts/gateguard.js" \
            "$HOME/.claude/scripts/git-guard.js" \
            "$HOME/.claude/scripts/delivery-gate.js" \
            "$HOME/.claude/scripts/suggest-compact.js" \
            "$HOME/.claude/scripts/plan-gate.js" \
            "$HOME/.codex/scripts/core-rules-digest.js" \
            "$HOME/.codex/scripts/git-guard.js" \
            "$HOME/.codex/scripts/plan-gate.js" \
            "$HOME/.copilot/scripts/core-rules-digest.js" \
            "$HOME/.copilot/scripts/git-guard.js" \
            "$HOME/.claude/CLAUDE.md" "$HOME/.codex/AGENTS.md" \
            "$HOME/.copilot/copilot-instructions.md"; do
            test -f "$f" || { echo "FAIL: missing $f"; exit 1; }
          done
          [ "$(jq -r .model "$HOME/.claude/settings.json")" = "opusplan" ]
          [ "$(jq -r .outputStyle "$HOME/.claude/settings.json")" = "Concise" ]
          [ "$(jq -r .switchModelsOnFlag "$HOME/.claude/settings.json")" = "true" ]
          [ "$(jq -r .enableArtifact "$HOME/.claude/settings.json")" = "false" ]
          assert_bare_permission_posture() {
            local h="$1" dm skip plugin
            local s="$h/.claude/settings.json"
            dm="$(jq -r '.permissions.defaultMode as $v | if $v == null then "unset" else ($v|tostring) end' "$s")"
            skip="$(jq -r '.skipDangerousModePermissionPrompt as $v | if $v == null then "unset" else ($v|tostring) end' "$s")"
            plugin="$(jq -r '.enabledPlugins["frontend-design@claude-plugins-official"] as $v | if $v == null then "unset" else ($v|tostring) end' "$s")"
            if [ "$dm" != "unset" ] || [ "$skip" != "unset" ] || [ "$plugin" != "false" ]; then
              echo "FAIL: bare install permission posture violated (defaultMode='$dm' skip='$skip' plugin='$plugin')"
              return 1
            fi
          }
          assert_bare_permission_posture "$HOME"
          [ "$(jq -r .model "$HOME/.copilot/settings.json")" = "auto" ]
          grep -q 'plan_mode_reasoning_effort = "xhigh"' "$HOME/.codex/config.toml"
          grep -q 'agent-plan-and-track:begin' "$HOME/.claude/CLAUDE.md"
          test -f "$HOME/.claude/skills/skill-comply/SKILL.md" \
            || { echo "FAIL: Claude skill-comply missing"; exit 1; }
          test -f "$HOME/.agents/skills/skill-comply/SKILL.md" \
            || { echo "FAIL: Codex skill-comply missing"; exit 1; }
          test ! -e "$HOME/.copilot/skills/skill-comply" \
            || { echo "FAIL: Copilot unexpectedly installed skill-comply"; exit 1; }
          # No unresolved placeholder leaked into any installed config.
          ! grep -rq '__SCRIPTS__' "$HOME/.claude" "$HOME/.codex" "$HOME/.copilot"
          # The digest hook command points at a script that actually exists...
          cmd="$(jq -r '.hooks.UserPromptSubmit[0].hooks[0].command' "$HOME/.claude/settings.json")"
          echo "$cmd" | grep -q 'core-rules-digest.js'
          f="$(echo "$cmd" | sed -E 's/^node "([^"]+)".*/\1/')"
          test -f "$f" || { echo "FAIL: baked hook path does not exist: $f"; exit 1; }
          # ...and it was merged exactly once (no double-merge across two installs).
          n="$(jq '[.. | .command? // empty | select(test("core-rules-digest"))] | length' "$HOME/.claude/settings.json")"
          [ "$n" = "1" ] || { echo "FAIL: expected 1 digest hook, found $n"; exit 1; }
          assert_codex_plan_gate() {
            local session_start apply_pre bash_pre apply_post total
            session_start="$(jq '[.hooks.SessionStart[]? | select(.matcher=="startup|resume") | .hooks[]? | select(.command|test("plan-gate\\.js.*--session-start"))] | length' "$HOME/.codex/hooks.json")"
            apply_pre="$(jq '[.hooks.PreToolUse[]? | select(.matcher=="apply_patch") | .hooks[]? | select(.command|test("plan-gate\\.js.*--pre"))] | length' "$HOME/.codex/hooks.json")"
            bash_pre="$(jq '[.hooks.PreToolUse[]? | select(.matcher=="Bash") | .hooks[]? | select(.command|test("plan-gate\\.js.*--pre"))] | length' "$HOME/.codex/hooks.json")"
            apply_post="$(jq '[.hooks.PostToolUse[]? | select(.matcher=="apply_patch") | .hooks[]? | select(.command|test("plan-gate\\.js.*--post"))] | length' "$HOME/.codex/hooks.json")"
            total="$(jq '[.. | .command? // empty | select(test("plan-gate\\.js"))] | length' "$HOME/.codex/hooks.json")"
            [ "$session_start" = "1" ] && [ "$apply_pre" = "1" ] && [ "$bash_pre" = "1" ] && [ "$apply_post" = "1" ] && [ "$total" = "4" ] \
              || { echo "FAIL: Codex plan-gate entries session-start=$session_start apply-pre=$apply_pre bash-pre=$bash_pre apply-post=$apply_post total=$total"; exit 1; }
          }
          assert_codex_plan_gate
          for missing in session-start apply-pre bash-pre apply-post; do
            case "$missing" in
              session-start) filter='.hooks.SessionStart |= map(select(.matcher != "startup|resume" or ([.hooks[]? | select(.command | test("plan-gate\\.js.*--session-start"))] | length == 0)))' ;;
              apply-pre) filter='.hooks.PreToolUse |= map(select(.matcher != "apply_patch" or ([.hooks[]? | select(.command | test("plan-gate\\.js.*--pre"))] | length == 0)))' ;;
              bash-pre) filter='.hooks.PreToolUse |= map(select(.matcher != "Bash" or ([.hooks[]? | select(.command | test("plan-gate\\.js.*--pre"))] | length == 0)))' ;;
              apply-post) filter='.hooks.PostToolUse |= map(select(.matcher != "apply_patch" or ([.hooks[]? | select(.command | test("plan-gate\\.js.*--post"))] | length == 0)))' ;;
            esac
            jq "$filter" "$HOME/.codex/hooks.json" > "$RUNNER_TEMP/partial-codex-hooks.json"
            mv "$RUNNER_TEMP/partial-codex-hooks.json" "$HOME/.codex/hooks.json"
            ./install.sh codex >/dev/null
            assert_codex_plan_gate
          done
          out="$(./install.sh codex)"
          echo "$out" | grep -q 'plan-gate hook  -- already present' \
            || { echo "FAIL: Codex plan-gate entries not idempotent"; exit 1; }
          assert_codex_plan_gate
          # Claude plan-gate: two additive PreToolUse entries on the same command
          # (Skill|Edit|Write|MultiEdit for the stamp/scope/lint gates, Bash for
          # the mutation gate), each checked and repaired per entry like the
          # Codex entries above.
          n="$(jq '[.hooks.PreToolUse[]? | select(.matcher=="Skill|Edit|Write|MultiEdit") | .hooks[]? | select(.command|test("plan-gate\\.js"))] | length' "$HOME/.claude/settings.json")"
          [ "$n" = "1" ] || { echo "FAIL: expected 1 Claude plan-gate stamp PreToolUse entry, found $n"; exit 1; }
          n="$(jq '[.hooks.PreToolUse[]? | select(.matcher=="Bash") | .hooks[]? | select(.command|test("plan-gate\\.js"))] | length' "$HOME/.claude/settings.json")"
          [ "$n" = "1" ] || { echo "FAIL: expected 1 Claude plan-gate Bash PreToolUse entry, found $n"; exit 1; }
          jq '.hooks.PreToolUse |= map(select(.matcher != "Bash"))' "$HOME/.claude/settings.json" > "$RUNNER_TEMP/partial-claude-settings.json"
          mv "$RUNNER_TEMP/partial-claude-settings.json" "$HOME/.claude/settings.json"
          ./install.sh claude >/dev/null
          n="$(jq '[.hooks.PreToolUse[]? | select(.matcher=="Bash") | .hooks[]? | select(.command|test("plan-gate\\.js"))] | length' "$HOME/.claude/settings.json")"
          [ "$n" = "1" ] || { echo "FAIL: Claude installer did not re-add the deleted plan-gate Bash entry"; exit 1; }
          # The deletion above removed every Bash-matcher PreToolUse entry, which
          # also wiped git-guard's entry (it shares the Bash matcher). Assert the
          # reinstall restored it too.
          n="$(jq '[.hooks.PreToolUse[]? | select(.matcher=="Bash") | .hooks[]? | select(.command|test("git-guard\\.js"))] | length' "$HOME/.claude/settings.json")"
          [ "$n" = "1" ] || { echo "FAIL: Claude installer did not re-add the deleted git-guard Bash entry"; exit 1; }
          # git-guard's Codex PreToolUse entry: matcher Bash, command pointing at
          # the installed git-guard.js (proves the wiring actually rendered, not
          # just that the script file exists).
          n="$(jq '[.hooks.PreToolUse[]? | select(.matcher=="Bash") | .hooks[]? | select(.command|test("git-guard\\.js"))] | length' "$HOME/.codex/hooks.json")"
          [ "$n" = "1" ] || { echo "FAIL: expected 1 Codex git-guard Bash PreToolUse entry, found $n"; exit 1; }
          cmd="$(jq -r '[.hooks.PreToolUse[]? | select(.matcher=="Bash") | .hooks[]? | select(.command|test("git-guard\\.js"))][0].command' "$HOME/.codex/hooks.json")"
          f="$(echo "$cmd" | sed -E 's/^node "([^"]+)".*/\1/')"
          test -f "$f" || { echo "FAIL: Codex git-guard command does not point at an installed script: $f"; exit 1; }
          # git-guard's Copilot rendered file: preToolUse entry, matcher, and the
          # substituted script path with no leftover __SCRIPTS__ placeholder.
          gg_copilot="$HOME/.copilot/hooks/pretooluse-git-guard.json"
          test -f "$gg_copilot" || { echo "FAIL: missing $gg_copilot"; exit 1; }
          n="$(jq '[.hooks.preToolUse[]? | select(.matcher=="bash|powershell") | select(.bash|test("git-guard\\.js"))] | length' "$gg_copilot")"
          [ "$n" = "1" ] || { echo "FAIL: expected 1 Copilot git-guard preToolUse entry, found $n"; exit 1; }
          bash_cmd="$(jq -r '.hooks.preToolUse[0].bash' "$gg_copilot")"
          echo "$bash_cmd" | grep -q '__SCRIPTS__' \
            && { echo "FAIL: Copilot git-guard file leaked __SCRIPTS__ placeholder"; exit 1; }
          f="$(echo "$bash_cmd" | sed -E 's/^node "([^"]+)".*/\1/')"
          test -f "$f" || { echo "FAIL: Copilot git-guard command does not point at an installed script: $f"; exit 1; }
          # Codex TOML agents: one rendered file per agents/*.md source.
          agent_md_count="$(ls agents/*.md | wc -l | tr -d ' ')"
          agent_toml_count="$(ls "$HOME/.codex/agents"/*.toml | wc -l | tr -d ' ')"
          [ "$agent_toml_count" = "$agent_md_count" ] \
            || { echo "FAIL: expected $agent_md_count Codex agent TOML files, found $agent_toml_count"; exit 1; }
          # Each rendered TOML must actually parse and carry exactly the expected
          # keys and source-tier-derived model/effort pair (existence/count alone
          # doesn't prove the renderer emitted valid or complete output).
          python3 -c "import glob, os, sys, tomllib; expected_keys={'name','description','model','model_reasoning_effort','sandbox_mode','developer_instructions'}; expected_agents={'architect-reviewer':('gpt-5.6-sol','high'),'debugger':('gpt-5.6-terra','high'),'executor':('gpt-5.6-terra','high'),'fable-advisor':('gpt-5.6-sol','high'),'mechanic':('gpt-5.6-luna','medium'),'planner':('gpt-5.6-sol','xhigh'),'researcher':('gpt-5.6-terra','high'),'security-auditor':('gpt-5.6-sol','high')}; files=sorted(glob.glob(os.path.join(sys.argv[1],'*.toml'))); assert files, 'no Codex agent TOML files found'; parsed={os.path.splitext(os.path.basename(f))[0]:tomllib.load(open(f,'rb')) for f in files}; bad_keys=[(name, sorted(agent.keys())) for name, agent in parsed.items() if set(agent.keys()) != expected_keys]; assert not bad_keys, f'bad TOML key sets: {bad_keys}'; rendered={name:(agent['model'], agent['model_reasoning_effort']) for name, agent in parsed.items()}; assert rendered == expected_agents, f'bad Codex model/effort mappings: {rendered}'; print(f'OK: validated model/effort mappings for {len(parsed)} rendered Codex agents')" "$HOME/.codex/agents"
          # A valid user-owned nested [features] table must survive unchanged.
          # The root plan-mode effort is pre-set so a successful Codex install
          # leaves this config byte-for-byte intact while still rendering every role.
          user_config_home="$RUNNER_TEMP/scratch-home-codex-user-features"
          mkdir -p "$user_config_home/.codex"
          printf '%s\n' 'plan_mode_reasoning_effort = "xhigh"' '' '[features.multi_agent_v2]' 'hide_spawn_agent_metadata = false' 'tool_namespace = "agents"' > "$user_config_home/.codex/config.toml"
          cp "$user_config_home/.codex/config.toml" "$RUNNER_TEMP/codex-user-features-before.toml"
          HOME="$user_config_home" ./install.sh codex >/dev/null
          cmp -s "$RUNNER_TEMP/codex-user-features-before.toml" "$user_config_home/.codex/config.toml" \
            || { echo "FAIL: Codex installer changed a user-owned feature table"; exit 1; }
          python3 -c "import sys, tomllib; config=tomllib.load(open(sys.argv[1], 'rb')); assert config['features']['multi_agent_v2'] == {'hide_spawn_agent_metadata': False, 'tool_namespace': 'agents'}, f\"Codex user feature table changed: {config['features']}\"; print('OK: Codex preserves a user-owned nested feature table')" "$user_config_home/.codex/config.toml"
          user_config_agent_count="$(ls "$user_config_home/.codex/agents"/*.toml | wc -l | tr -d ' ')"
          [ "$user_config_agent_count" = "$agent_md_count" ] \
            || { echo "FAIL: expected $agent_md_count Codex agent TOML files in user-config home, found $user_config_agent_count"; exit 1; }
          python3 -c "import glob, os, sys, tomllib; expected_agents={'architect-reviewer':('gpt-5.6-sol','high'),'debugger':('gpt-5.6-terra','high'),'executor':('gpt-5.6-terra','high'),'fable-advisor':('gpt-5.6-sol','high'),'mechanic':('gpt-5.6-luna','medium'),'planner':('gpt-5.6-sol','xhigh'),'researcher':('gpt-5.6-terra','high'),'security-auditor':('gpt-5.6-sol','high')}; files=sorted(glob.glob(os.path.join(sys.argv[1],'*.toml'))); parsed={os.path.splitext(os.path.basename(f))[0]:tomllib.load(open(f,'rb')) for f in files}; rendered={name:(agent['model'], agent['model_reasoning_effort']) for name, agent in parsed.items()}; assert rendered == expected_agents, f'bad Codex model/effort mappings in user-config home: {rendered}'; print(f'OK: validated model/effort mappings for {len(parsed)} rendered Codex agents in user-config home')" "$user_config_home/.codex/agents"
          # Copilot agents: one rendered file per agents/*.md source.
          copilot_agent_count="$(ls "$HOME/.copilot/agents"/*.agent.md | wc -l | tr -d ' ')"
          [ "$copilot_agent_count" = "$agent_md_count" ] \
            || { echo "FAIL: expected $agent_md_count Copilot agent files, found $copilot_agent_count"; exit 1; }
          # Mapping spot-check on the rendered executor agent: expected tool
          # aliases, fenced frontmatter, and neither Claude's model nor effort key
          # (the Copilot render deliberately omits both).
          executor_agent="$HOME/.copilot/agents/executor.agent.md"
          grep -qF 'tools: ["read", "search", "edit", "execute"]' "$executor_agent" \
            || { echo "FAIL: executor.agent.md missing expected tools mapping"; exit 1; }
          [ "$(head -n1 "$executor_agent")" = "---" ] \
            || { echo "FAIL: executor.agent.md does not start with a --- fence"; exit 1; }
          if grep -q '^model:' "$executor_agent"; then echo "FAIL: executor.agent.md unexpectedly carries a model: line"; exit 1; fi
          if grep -q '^effort:' "$executor_agent"; then echo "FAIL: executor.agent.md unexpectedly carries an effort: line"; exit 1; fi
      - name: Permission posture is opt-in only
        run: |
          set -euo pipefail
          # Duplicated verbatim from the "Assert layout, defaults, and hook wiring"
          # step: each run: block is its own process, so a function defined there
          # does not exist here. Edit both copies together.
          assert_bare_permission_posture() {
            local h="$1" dm skip plugin
            local s="$h/.claude/settings.json"
            dm="$(jq -r '.permissions.defaultMode as $v | if $v == null then "unset" else ($v|tostring) end' "$s")"
            skip="$(jq -r '.skipDangerousModePermissionPrompt as $v | if $v == null then "unset" else ($v|tostring) end' "$s")"
            plugin="$(jq -r '.enabledPlugins["frontend-design@claude-plugins-official"] as $v | if $v == null then "unset" else ($v|tostring) end' "$s")"
            if [ "$dm" != "unset" ] || [ "$skip" != "unset" ] || [ "$plugin" != "false" ]; then
              echo "FAIL: bare install permission posture violated (defaultMode='$dm' skip='$skip' plugin='$plugin')"
              return 1
            fi
          }
          # 1. Opt-in: with the variable set, the Claude target must set all three keys.
          export HOME="$RUNNER_TEMP/scratch-home-bypass-optin"; mkdir -p "$HOME"
          export PT_BYPASS_PERMISSIONS=1
          ./install.sh claude >/dev/null
          unset PT_BYPASS_PERMISSIONS
          s="$HOME/.claude/settings.json"
          [ "$(jq -r '.permissions.defaultMode' "$s")" = "bypassPermissions" ] \
            || { echo "FAIL: opt-in install did not set defaultMode"; exit 1; }
          [ "$(jq -r '.skipDangerousModePermissionPrompt' "$s")" = "true" ] \
            || { echo "FAIL: opt-in install did not set skip flag"; exit 1; }
          [ "$(jq -r '.enabledPlugins["frontend-design@claude-plugins-official"]' "$s")" = "false" ] \
            || { echo "FAIL: opt-in install did not disable the plugin"; exit 1; }
          # All three are re-asserted over conflicting existing values, not merely
          # inserted into an empty file. Checked in the same home because the
          # assertions above start from empty, which a set-if-absent implementation
          # would also satisfy.
          printf '%s' '{"permissions":{"defaultMode":"plan"},"skipDangerousModePermissionPrompt":false,"enabledPlugins":{"frontend-design@claude-plugins-official":true}}' > "$s"
          PT_BYPASS_PERMISSIONS=1 ./install.sh claude >/dev/null
          [ "$(jq -r '.permissions.defaultMode' "$s")" = "bypassPermissions" ] \
            || { echo "FAIL: opt-in install did not overwrite a conflicting defaultMode"; exit 1; }
          [ "$(jq -r '.skipDangerousModePermissionPrompt' "$s")" = "true" ] \
            || { echo "FAIL: opt-in install did not overwrite a conflicting skip flag"; exit 1; }
          [ "$(jq -r '.enabledPlugins["frontend-design@claude-plugins-official"]' "$s")" = "false" ] \
            || { echo "FAIL: opt-in install did not overwrite a conflicting plugin value"; exit 1; }
          # 2. Survival: a pre-existing stricter posture and an unrelated plugin
          # entry must survive a BARE install untouched, aside from the plugin disable.
          export HOME="$RUNNER_TEMP/scratch-home-bypass-survival"; mkdir -p "$HOME/.claude"
          printf '%s' '{"permissions":{"defaultMode":"default"},"enabledPlugins":{"life@laerdal":true}}' > "$HOME/.claude/settings.json"
          ./install.sh claude >/dev/null
          s="$HOME/.claude/settings.json"
          [ "$(jq -r '.permissions.defaultMode' "$s")" = "default" ] \
            || { echo "FAIL: bare install altered a pre-existing defaultMode"; exit 1; }
          [ "$(jq -r '.skipDangerousModePermissionPrompt as $v | if $v == null then "unset" else ($v|tostring) end' "$s")" = "unset" ] \
            || { echo "FAIL: bare install added the skip flag"; exit 1; }
          [ "$(jq -r '.enabledPlugins["frontend-design@claude-plugins-official"]' "$s")" = "false" ] \
            || { echo "FAIL: bare install did not disable the plugin"; exit 1; }
          [ "$(jq -r '.enabledPlugins["life@laerdal"]' "$s")" = "true" ] \
            || { echo "FAIL: bare install disturbed an unrelated plugin entry"; exit 1; }
          # 3. Null intermediates: a settings file whose permissions/enabledPlugins
          # are JSON null must not abort the install. jq's setpath replaces a null
          # with an object, and Set-JsonPath has to match that.
          export HOME="$RUNNER_TEMP/scratch-home-bypass-null"; mkdir -p "$HOME/.claude"
          printf '%s' '{"permissions":null,"enabledPlugins":null}' > "$HOME/.claude/settings.json"
          ./install.sh claude >/dev/null
          assert_bare_permission_posture "$HOME"
          # 4. Negative control: prove part A's assertion is not vacuous by running
          # it against a home whose settings deliberately already carry both bypass keys.
          export HOME="$RUNNER_TEMP/scratch-home-bypass-negctrl"; mkdir -p "$HOME/.claude"
          printf '%s' '{"permissions":{"defaultMode":"bypassPermissions"},"skipDangerousModePermissionPrompt":true,"enabledPlugins":{"frontend-design@claude-plugins-official":false}}' > "$HOME/.claude/settings.json"
          # Its own diagnostic is discarded: this call is EXPECTED to fail, and a
          # stray "FAIL:" line in a green log reads as a broken job.
          if assert_bare_permission_posture "$HOME" >/dev/null 2>&1; then
            echo "FAIL: assert_bare_permission_posture passed against a fixture that deliberately carries both bypass keys"
            exit 1
          fi
          echo "OK: the bare-posture assertion rejects a settings file carrying the bypass keys"
      - name: PT_KEEP_MODEL keeps an existing choice
        run: |
          set -euo pipefail
          # 1. Opt-out: PT_KEEP_MODEL=1 must leave a pre-existing managed value alone.
          export HOME="$RUNNER_TEMP/scratch-home-keep-model"; mkdir -p "$HOME/.claude"
          printf '%s' '{"model":"sonnet","outputStyle":"Explanatory","enableArtifact":true}' > "$HOME/.claude/settings.json"
          PT_KEEP_MODEL=1 ./install.sh claude >/dev/null
          s="$HOME/.claude/settings.json"
          [ "$(jq -r .model "$s")" = "sonnet" ] \
            || { echo "FAIL: PT_KEEP_MODEL=1 overwrote an existing model"; exit 1; }
          [ "$(jq -r .outputStyle "$s")" = "Explanatory" ] \
            || { echo "FAIL: PT_KEEP_MODEL=1 overwrote an existing outputStyle"; exit 1; }
          [ "$(jq -r .enableArtifact "$s")" = "true" ] \
            || { echo "FAIL: PT_KEEP_MODEL=1 overwrote an existing enableArtifact"; exit 1; }
          # 2. Negative control: prove part 1 is not vacuous. The SAME fixture under a
          # BARE install must be overwritten with the repo-owned defaults.
          export HOME="$RUNNER_TEMP/scratch-home-keep-model-negctrl"; mkdir -p "$HOME/.claude"
          printf '%s' '{"model":"sonnet","outputStyle":"Explanatory","enableArtifact":true}' > "$HOME/.claude/settings.json"
          ./install.sh claude >/dev/null
          s="$HOME/.claude/settings.json"
          [ "$(jq -r .model "$s")" = "opusplan" ] \
            || { echo "FAIL: bare install did not re-assert the model default"; exit 1; }
          [ "$(jq -r .outputStyle "$s")" = "Concise" ] \
            || { echo "FAIL: bare install did not re-assert the outputStyle default"; exit 1; }
          [ "$(jq -r .enableArtifact "$s")" = "false" ] \
            || { echo "FAIL: bare install did not re-assert the enableArtifact default"; exit 1; }
          echo "OK: PT_KEEP_MODEL=1 preserves model, outputStyle, and enableArtifact; a bare install re-asserts all three"
      - name: jq missing offers to install (stubbed apt-get, no network)
        run: |
          set -euo pipefail
          # Hide every already-installed jq (and brew, if present) from PATH
          # without disturbing anything else that shares their directory:
          # recreate every other executable those directories provide under a
          # shadow dir, then drop the directories themselves from PATH. This
          # job's own "Tooling versions" step proves jq already resolves here,
          # so a plain stub-dir prepend (the Office skills installer step's
          # own approach) would leave the real jq reachable further down PATH
          # and never exercise the new offer logic. Scanning every PATH entry
          # directly, rather than trusting command -v's first match, matters
          # too: some platforms carry more than one jq on PATH at once.
          hide_dirs=""
          old_ifs="$IFS"; IFS=':'
          for d in $PATH; do
            [ -n "$d" ] || continue
            if [ -x "$d/jq" ] || [ -x "$d/brew" ]; then
              case ":$hide_dirs:" in *":$d:"*) ;; *) hide_dirs="$hide_dirs:$d" ;; esac
            fi
          done
          IFS="$old_ifs"
          hide_dirs="${hide_dirs#:}"
          shadow_dir="$RUNNER_TEMP/jq-shadow-bin"
          mkdir -p "$shadow_dir"
          if [ -n "$hide_dirs" ]; then
            old_ifs="$IFS"; IFS=':'
            for d in $hide_dirs; do
              for f in "$d"/*; do
                base="$(basename "$f")"
                case "$base" in jq|brew) continue ;; esac
                [ -e "$shadow_dir/$base" ] && continue
                ln -sf "$f" "$shadow_dir/$base" 2>/dev/null || true
              done
            done
            IFS="$old_ifs"
          fi
          filtered=""
          IFS=':' read -ra parts <<< "$PATH"
          for p in "${parts[@]}"; do
            case ":$hide_dirs:" in *":$p:"*) continue ;; esac
            filtered="$filtered:$p"
          done
          filtered="${filtered#:}"

          # Fake sudo AND apt-get (real sudo's secure_path ignores PATH
          # overrides for the wrapped command, so faking only apt-get would
          # let a sudo-prefixed call escape the stub straight to the real
          # package manager). The fake sudo just execs its argv unprivileged;
          # the fake apt-get logs every call and, on `install`, symlinks the
          # real jq (captured before it was hidden) into a directory that
          # only now joins PATH, so a completed offer ends with a genuinely
          # working jq rather than a dummy stub, matching what install_claude's
          # own JSON merges need afterward.
          real_jq="$(command -v jq 2>/dev/null || true)"
          stub_bin="$RUNNER_TEMP/jq-stub-bin"; mkdir -p "$stub_bin"
          installed_dir="$RUNNER_TEMP/jq-installed-bin"; mkdir -p "$installed_dir"
          apt_log="$RUNNER_TEMP/jq-apt-log.txt"; rm -f "$apt_log"
          export REAL_JQ="$real_jq" INSTALLED_DIR="$installed_dir" APT_LOG="$apt_log"
          cat > "$stub_bin/apt-get" <<'STUB'
          #!/usr/bin/env bash
          echo "$*" >> "$APT_LOG"
          if [ "$1" = "install" ] && [ -n "${REAL_JQ:-}" ]; then
            mkdir -p "$INSTALLED_DIR"
            ln -sf "$REAL_JQ" "$INSTALLED_DIR/jq"
          fi
          exit 0
          STUB
          chmod +x "$stub_bin/apt-get"
          cat > "$stub_bin/sudo" <<'STUB'
          #!/usr/bin/env bash
          exec "$@"
          STUB
          chmod +x "$stub_bin/sudo"

          export PATH="$stub_bin:$shadow_dir:$installed_dir:$filtered"
          command -v jq >/dev/null 2>&1 \
            && { echo "FAIL: jq is still resolvable after hiding it (found: $(command -v jq))"; exit 1; }

          # (a) non-interactive, no PT_INSTALL_JQ: refuses fast, names the
          # install command and the PT_INSTALL_JQ=1 opt-in in stderr, never
          # invokes the stub package manager, writes no files.
          export HOME="$RUNNER_TEMP/scratch-home-jq-refuse"; mkdir -p "$HOME"
          set +e
          err="$(./install.sh claude 2>&1 1>/dev/null < /dev/null)"
          code=$?
          set -e
          [ "$code" -eq 1 ] || { echo "FAIL: refusal exit code was $code, not 1"; exit 1; }
          echo "$err" | grep -qF 'error: jq is required (install with: sudo apt-get update && sudo apt-get install -y jq)' \
            || { echo "FAIL: refusal did not name the install command"; echo "$err"; exit 1; }
          echo "$err" | grep -qF 'PT_INSTALL_JQ=1 to authorize the install' \
            || { echo "FAIL: refusal did not mention the PT_INSTALL_JQ=1 opt-in"; echo "$err"; exit 1; }
          [ ! -s "$apt_log" ] || { echo "FAIL: apt-get was invoked during a refused install"; cat "$apt_log"; exit 1; }
          [ -z "$(find "$HOME" -mindepth 1 2>/dev/null)" ] \
            || { echo "FAIL: refused install wrote files under HOME"; find "$HOME"; exit 1; }

          # (b) Copilot needs no jq at all.
          export HOME="$RUNNER_TEMP/scratch-home-jq-copilot"; mkdir -p "$HOME"
          ./install.sh copilot >/dev/null

          # (c) PT_INSTALL_JQ=1 drives the stubbed apt-get end-to-end and
          # completes the install.
          export HOME="$RUNNER_TEMP/scratch-home-jq-install"; mkdir -p "$HOME"
          PT_INSTALL_JQ=1 ./install.sh claude >/dev/null
          grep -qF 'install -y jq' "$apt_log" \
            || { echo "FAIL: PT_INSTALL_JQ=1 never invoked the stubbed apt-get install"; exit 1; }
          test -f "$HOME/.claude/settings.json" \
            || { echo "FAIL: PT_INSTALL_JQ=1 install did not complete"; exit 1; }
