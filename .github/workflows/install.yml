name: installer smoke test

# Verifies that both installers deploy a correct, idempotent file layout and that
# the shared Node scripts run on each platform. Out of scope (no harness CLI on
# the runners): whether Claude/Codex/Copilot actually load and fire the hooks at
# session time. That is the manual smoke test noted in tasks/todo.md Phase E.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tooling versions
        run: jq --version && node --version
      - name: Install twice (idempotent) into a scratch HOME
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home"; mkdir -p "$HOME"
          ./install.sh all
          out="$(./install.sh all)"
          echo "$out"
          echo "$out" | grep -q 'digest hook     -- already present' \
            || { echo "FAIL: digest hook not detected as already present on re-run"; exit 1; }
      - name: Assert layout, defaults, and hook wiring
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home"
          for f in \
            "$HOME/.claude/scripts/core-rules-digest.js" \
            "$HOME/.claude/scripts/gateguard.js" \
            "$HOME/.claude/scripts/delivery-gate.js" \
            "$HOME/.claude/scripts/suggest-compact.js" \
            "$HOME/.claude/scripts/plan-gate.js" \
            "$HOME/.codex/scripts/core-rules-digest.js" \
            "$HOME/.codex/scripts/plan-gate.js" \
            "$HOME/.copilot/scripts/core-rules-digest.js" \
            "$HOME/.claude/CLAUDE.md" "$HOME/.codex/AGENTS.md" \
            "$HOME/.copilot/copilot-instructions.md"; do
            test -f "$f" || { echo "FAIL: missing $f"; exit 1; }
          done
          [ "$(jq -r .model "$HOME/.claude/settings.json")" = "opusplan" ]
          [ "$(jq -r .switchModelsOnFlag "$HOME/.claude/settings.json")" = "true" ]
          assert_bare_permission_posture() {
            local h="$1" dm skip plugin
            local s="$h/.claude/settings.json"
            dm="$(jq -r '.permissions.defaultMode as $v | if $v == null then "unset" else ($v|tostring) end' "$s")"
            skip="$(jq -r '.skipDangerousModePermissionPrompt as $v | if $v == null then "unset" else ($v|tostring) end' "$s")"
            plugin="$(jq -r '.enabledPlugins["frontend-design@claude-plugins-official"] as $v | if $v == null then "unset" else ($v|tostring) end' "$s")"
            if [ "$dm" != "unset" ] || [ "$skip" != "unset" ] || [ "$plugin" != "false" ]; then
              echo "FAIL: bare install permission posture violated (defaultMode='$dm' skip='$skip' plugin='$plugin')"
              return 1
            fi
          }
          assert_bare_permission_posture "$HOME"
          [ "$(jq -r .model "$HOME/.copilot/settings.json")" = "auto" ]
          grep -q 'plan_mode_reasoning_effort = "xhigh"' "$HOME/.codex/config.toml"
          grep -q 'agent-plan-and-track:begin' "$HOME/.claude/CLAUDE.md"
          test -f "$HOME/.claude/skills/skill-comply/SKILL.md" \
            || { echo "FAIL: Claude skill-comply missing"; exit 1; }
          test -f "$HOME/.agents/skills/skill-comply/SKILL.md" \
            || { echo "FAIL: Codex skill-comply missing"; exit 1; }
          test ! -e "$HOME/.copilot/skills/skill-comply" \
            || { echo "FAIL: Copilot unexpectedly installed skill-comply"; exit 1; }
          # No unresolved placeholder leaked into any installed config.
          ! grep -rq '__SCRIPTS__' "$HOME/.claude" "$HOME/.codex" "$HOME/.copilot"
          # The digest hook command points at a script that actually exists...
          cmd="$(jq -r '.hooks.UserPromptSubmit[0].hooks[0].command' "$HOME/.claude/settings.json")"
          echo "$cmd" | grep -q 'core-rules-digest.js'
          f="$(echo "$cmd" | sed -E 's/^node "([^"]+)".*/\1/')"
          test -f "$f" || { echo "FAIL: baked hook path does not exist: $f"; exit 1; }
          # ...and it was merged exactly once (no double-merge across two installs).
          n="$(jq '[.. | .command? // empty | select(test("core-rules-digest"))] | length' "$HOME/.claude/settings.json")"
          [ "$n" = "1" ] || { echo "FAIL: expected 1 digest hook, found $n"; exit 1; }
          assert_codex_plan_gate() {
            local apply_pre bash_pre apply_post total
            apply_pre="$(jq '[.hooks.PreToolUse[]? | select(.matcher=="apply_patch") | .hooks[]? | select(.command|test("plan-gate\\.js.*--pre"))] | length' "$HOME/.codex/hooks.json")"
            bash_pre="$(jq '[.hooks.PreToolUse[]? | select(.matcher=="Bash") | .hooks[]? | select(.command|test("plan-gate\\.js.*--pre"))] | length' "$HOME/.codex/hooks.json")"
            apply_post="$(jq '[.hooks.PostToolUse[]? | select(.matcher=="apply_patch") | .hooks[]? | select(.command|test("plan-gate\\.js.*--post"))] | length' "$HOME/.codex/hooks.json")"
            total="$(jq '[.. | .command? // empty | select(test("plan-gate\\.js"))] | length' "$HOME/.codex/hooks.json")"
            [ "$apply_pre" = "1" ] && [ "$bash_pre" = "1" ] && [ "$apply_post" = "1" ] && [ "$total" = "3" ] \
              || { echo "FAIL: Codex plan-gate entries apply-pre=$apply_pre bash-pre=$bash_pre apply-post=$apply_post total=$total"; exit 1; }
          }
          assert_codex_plan_gate
          for missing in apply-pre bash-pre apply-post; do
            case "$missing" in
              apply-pre) filter='.hooks.PreToolUse |= map(select(.matcher != "apply_patch" or ([.hooks[]? | select(.command | test("plan-gate\\.js.*--pre"))] | length == 0)))' ;;
              bash-pre) filter='.hooks.PreToolUse |= map(select(.matcher != "Bash" or ([.hooks[]? | select(.command | test("plan-gate\\.js.*--pre"))] | length == 0)))' ;;
              apply-post) filter='.hooks.PostToolUse |= map(select(.matcher != "apply_patch" or ([.hooks[]? | select(.command | test("plan-gate\\.js.*--post"))] | length == 0)))' ;;
            esac
            jq "$filter" "$HOME/.codex/hooks.json" > "$RUNNER_TEMP/partial-codex-hooks.json"
            mv "$RUNNER_TEMP/partial-codex-hooks.json" "$HOME/.codex/hooks.json"
            ./install.sh codex >/dev/null
            assert_codex_plan_gate
          done
          out="$(./install.sh codex)"
          echo "$out" | grep -q 'plan-gate hook  -- already present' \
            || { echo "FAIL: Codex plan-gate entries not idempotent"; exit 1; }
          assert_codex_plan_gate
          # Claude plan-gate: two additive PreToolUse entries on the same command
          # (Skill|Edit|Write|MultiEdit for the stamp/scope/lint gates, Bash for
          # the mutation gate), each checked and repaired per entry like the
          # Codex entries above.
          n="$(jq '[.hooks.PreToolUse[]? | select(.matcher=="Skill|Edit|Write|MultiEdit") | .hooks[]? | select(.command|test("plan-gate\\.js"))] | length' "$HOME/.claude/settings.json")"
          [ "$n" = "1" ] || { echo "FAIL: expected 1 Claude plan-gate stamp PreToolUse entry, found $n"; exit 1; }
          n="$(jq '[.hooks.PreToolUse[]? | select(.matcher=="Bash") | .hooks[]? | select(.command|test("plan-gate\\.js"))] | length' "$HOME/.claude/settings.json")"
          [ "$n" = "1" ] || { echo "FAIL: expected 1 Claude plan-gate Bash PreToolUse entry, found $n"; exit 1; }
          jq '.hooks.PreToolUse |= map(select(.matcher != "Bash"))' "$HOME/.claude/settings.json" > "$RUNNER_TEMP/partial-claude-settings.json"
          mv "$RUNNER_TEMP/partial-claude-settings.json" "$HOME/.claude/settings.json"
          ./install.sh claude >/dev/null
          n="$(jq '[.hooks.PreToolUse[]? | select(.matcher=="Bash") | .hooks[]? | select(.command|test("plan-gate\\.js"))] | length' "$HOME/.claude/settings.json")"
          [ "$n" = "1" ] || { echo "FAIL: Claude installer did not re-add the deleted plan-gate Bash entry"; exit 1; }
          # Codex TOML agents: one rendered file per agents/*.md source.
          agent_md_count="$(ls agents/*.md | wc -l | tr -d ' ')"
          agent_toml_count="$(ls "$HOME/.codex/agents"/*.toml | wc -l | tr -d ' ')"
          [ "$agent_toml_count" = "$agent_md_count" ] \
            || { echo "FAIL: expected $agent_md_count Codex agent TOML files, found $agent_toml_count"; exit 1; }
          # Each rendered TOML must actually parse and carry exactly the expected
          # keys, with no stray Claude `model` key (existence/count alone doesn't
          # prove the renderer emitted valid or complete output).
          python3 -c "import glob, os, sys, tomllib; expected={'name','description','model_reasoning_effort','sandbox_mode','developer_instructions'}; files=sorted(glob.glob(os.path.join(sys.argv[1],'*.toml'))); assert files, 'no Codex agent TOML files found'; bad=[(f, sorted(tomllib.load(open(f,'rb')).keys())) for f in files if set(tomllib.load(open(f,'rb')).keys())!=expected]; assert not bad, f'bad TOML key sets: {bad}'; print(f'OK: validated TOML structure for {len(files)} rendered Codex agents')" "$HOME/.codex/agents"
          # Copilot agents: one rendered file per agents/*.md source.
          copilot_agent_count="$(ls "$HOME/.copilot/agents"/*.agent.md | wc -l | tr -d ' ')"
          [ "$copilot_agent_count" = "$agent_md_count" ] \
            || { echo "FAIL: expected $agent_md_count Copilot agent files, found $copilot_agent_count"; exit 1; }
          # Mapping spot-check on the rendered executor agent: expected tool
          # aliases, fenced frontmatter, and neither Claude's model nor effort key
          # (the Copilot render deliberately omits both).
          executor_agent="$HOME/.copilot/agents/executor.agent.md"
          grep -qF 'tools: ["read", "search", "edit", "execute"]' "$executor_agent" \
            || { echo "FAIL: executor.agent.md missing expected tools mapping"; exit 1; }
          [ "$(head -n1 "$executor_agent")" = "---" ] \
            || { echo "FAIL: executor.agent.md does not start with a --- fence"; exit 1; }
          if grep -q '^model:' "$executor_agent"; then echo "FAIL: executor.agent.md unexpectedly carries a model: line"; exit 1; fi
          if grep -q '^effort:' "$executor_agent"; then echo "FAIL: executor.agent.md unexpectedly carries an effort: line"; exit 1; fi
      - name: Permission posture is opt-in only
        run: |
          set -euo pipefail
          # Duplicated verbatim from the "Assert layout, defaults, and hook wiring"
          # step: each run: block is its own process, so a function defined there
          # does not exist here. Edit both copies together.
          assert_bare_permission_posture() {
            local h="$1" dm skip plugin
            local s="$h/.claude/settings.json"
            dm="$(jq -r '.permissions.defaultMode as $v | if $v == null then "unset" else ($v|tostring) end' "$s")"
            skip="$(jq -r '.skipDangerousModePermissionPrompt as $v | if $v == null then "unset" else ($v|tostring) end' "$s")"
            plugin="$(jq -r '.enabledPlugins["frontend-design@claude-plugins-official"] as $v | if $v == null then "unset" else ($v|tostring) end' "$s")"
            if [ "$dm" != "unset" ] || [ "$skip" != "unset" ] || [ "$plugin" != "false" ]; then
              echo "FAIL: bare install permission posture violated (defaultMode='$dm' skip='$skip' plugin='$plugin')"
              return 1
            fi
          }
          # 1. Opt-in: with the variable set, the Claude target must set all three keys.
          export HOME="$RUNNER_TEMP/scratch-home-bypass-optin"; mkdir -p "$HOME"
          export PT_BYPASS_PERMISSIONS=1
          ./install.sh claude >/dev/null
          unset PT_BYPASS_PERMISSIONS
          s="$HOME/.claude/settings.json"
          [ "$(jq -r '.permissions.defaultMode' "$s")" = "bypassPermissions" ] \
            || { echo "FAIL: opt-in install did not set defaultMode"; exit 1; }
          [ "$(jq -r '.skipDangerousModePermissionPrompt' "$s")" = "true" ] \
            || { echo "FAIL: opt-in install did not set skip flag"; exit 1; }
          [ "$(jq -r '.enabledPlugins["frontend-design@claude-plugins-official"]' "$s")" = "false" ] \
            || { echo "FAIL: opt-in install did not disable the plugin"; exit 1; }
          # 2. Survival: a pre-existing stricter posture and an unrelated plugin
          # entry must survive a BARE install untouched, aside from the plugin disable.
          export HOME="$RUNNER_TEMP/scratch-home-bypass-survival"; mkdir -p "$HOME/.claude"
          printf '%s' '{"permissions":{"defaultMode":"default"},"enabledPlugins":{"life@laerdal":true}}' > "$HOME/.claude/settings.json"
          ./install.sh claude >/dev/null
          s="$HOME/.claude/settings.json"
          [ "$(jq -r '.permissions.defaultMode' "$s")" = "default" ] \
            || { echo "FAIL: bare install altered a pre-existing defaultMode"; exit 1; }
          [ "$(jq -r '.skipDangerousModePermissionPrompt as $v | if $v == null then "unset" else ($v|tostring) end' "$s")" = "unset" ] \
            || { echo "FAIL: bare install added the skip flag"; exit 1; }
          [ "$(jq -r '.enabledPlugins["frontend-design@claude-plugins-official"]' "$s")" = "false" ] \
            || { echo "FAIL: bare install did not disable the plugin"; exit 1; }
          [ "$(jq -r '.enabledPlugins["life@laerdal"]' "$s")" = "true" ] \
            || { echo "FAIL: bare install disturbed an unrelated plugin entry"; exit 1; }
          # 3. Negative control: prove part A's assertion is not vacuous by running
          # it against a home whose settings deliberately already carry both bypass keys.
          export HOME="$RUNNER_TEMP/scratch-home-bypass-negctrl"; mkdir -p "$HOME/.claude"
          printf '%s' '{"permissions":{"defaultMode":"bypassPermissions"},"skipDangerousModePermissionPrompt":true,"enabledPlugins":{"frontend-design@claude-plugins-official":false}}' > "$HOME/.claude/settings.json"
          # Its own diagnostic is discarded: this call is EXPECTED to fail, and a
          # stray "FAIL:" line in a green log reads as a broken job.
          if assert_bare_permission_posture "$HOME" >/dev/null 2>&1; then
            echo "FAIL: assert_bare_permission_posture passed against a fixture that deliberately carries both bypass keys"
            exit 1
          fi
          echo "OK: the bare-posture assertion rejects a settings file carrying the bypass keys"
      - name: Shared Node scripts run
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home"
          node "$HOME/.claude/scripts/core-rules-digest.js" | grep -q . \
            || { echo "FAIL: digest produced no output"; exit 1; }
          node "$HOME/.copilot/scripts/core-rules-digest.js" --copilot >/dev/null
          node skills/skill-activation/scripts/run-activation-cases.js --dry-run >/dev/null
          node skills/skill-activation/scripts/run-activation-cases.js --precheck "$HOME/.claude/skills" >/dev/null
          node skills/skill-activation/scripts/run-activation-cases.js --precheck-agents agents "$HOME" >/dev/null
          node skills/skill-activation/scripts/run-behavioral-smokes.js --dry-run >/dev/null
          node skills/skill-activation/scripts/run-live-runner-fixtures.js >/dev/null
          node skills/context-budget/scripts/scan-context.js ./skills >/dev/null
          node skills/skill-comply/scripts/run-codex-cases.js --dry-run >/dev/null
          node hooks/codex/scripts/run-plan-gate-pilot-fixtures.js >/dev/null
          node hooks/claude/scripts/run-plan-gate-fixtures.js >/dev/null
          node skills/rules-distill/scripts/scan-rules.js >/dev/null
          node skills/rules-distill/scripts/scan-skills.js ./skills >/dev/null
          node .github/scripts/run-lint-pr-body-fixtures.js >/dev/null
          node .github/scripts/check-digest-preview.js >/dev/null
          node .github/scripts/run-check-digest-preview-fixtures.js >/dev/null
      - name: Probe-agent frontmatter escape/quote round-trip
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home"
          # Two throwaway agents/*.md sources exercising the two frontmatter
          # defects frontmatter_field's decode covers: a single-quoted
          # description with a doubled '' escape, and a double-quoted one with
          # a \" escape. Removed at the end of this step; never committed.
          cat > agents/zz-probe-single.md <<'PROBE'
          ---
          name: zz-probe-single
          description: 'Use when: the value has an apostrophe, like don''t skip this step.'
          model: sonnet
          effort: high
          tools: Read, Grep, Glob
          ---

          Probe agent for CI only; removed at the end of this step.
          PROBE
          cat > agents/zz-probe-escape.md <<'PROBE'
          ---
          name: zz-probe-escape
          description: "Use when: the value says \"hello\" and has a backslash before an escaped quote \\\" like that."
          model: sonnet
          effort: high
          tools: Read, Grep, Glob
          ---

          Probe agent for CI only; removed at the end of this step.
          PROBE
          ./install.sh claude >/dev/null
          ./install.sh codex >/dev/null
          ./install.sh copilot >/dev/null
          # The decoded description must round-trip identically into all three
          # rendered formats (Claude copy, Codex TOML, Copilot .agent.md).
          node skills/skill-activation/scripts/run-activation-cases.js --precheck-agents agents "$HOME" >/dev/null
          # The Copilot render's tools value must be a YAML flow array, not a
          # bare or leaked-quote string.
          grep -qF 'tools: ["read", "search"]' "$HOME/.copilot/agents/zz-probe-single.agent.md" \
            || { echo "FAIL: zz-probe-single.agent.md missing expected YAML flow array tools"; exit 1; }
          rm -f agents/zz-probe-single.md agents/zz-probe-escape.md
          # New defect: a value whose backslash escapes something the
          # installers cannot render (a tab) is legal YAML, so it would abort
          # the installers even though it passes frontmatter_invalid_yaml;
          # --precheck-agents must reject it before it ever reaches disk.
          cat > agents/zz-probe-uninstallable.md <<'PROBE'
          ---
          name: zz-probe-uninstallable
          description: "Use when: testing an uninstallable escape \t here."
          model: sonnet
          effort: high
          tools: Read, Grep, Glob
          ---

          Probe agent for CI only; removed at the end of this step.
          PROBE
          # No installed-home argument on purpose. This probe is never
          # installed, so passing one would make all three description-match
          # flags false and the run would exit nonzero whatever the new check
          # did, which is a vacuous test. Source-only, then attribute the
          # rejection to the flag by name rather than trusting the exit code.
          probe_out="$RUNNER_TEMP/uninstallable-probe.json"
          if node skills/skill-activation/scripts/run-activation-cases.js --precheck-agents agents > "$probe_out" 2>&1; then
            echo "FAIL: --precheck-agents accepted an uninstallable \\t escape"; exit 1
          fi
          grep -q '"frontmatter_uninstallable_escape": true' "$probe_out" \
            || { echo "FAIL: rejection was not attributed to frontmatter_uninstallable_escape"; cat "$probe_out"; exit 1; }
          rm -f agents/zz-probe-uninstallable.md
          # Third defect: a value whose two ends are different quotes must come
          # back byte-verbatim rather than have each end stripped on its own.
          # Asserted against the render directly, not through
          # --precheck-agents, which flags such a value as invalid frontmatter
          # by design, and after the probes above are removed so it cannot
          # contaminate their round-trip check.
          q="'"
          printf -- '---\nname: zz-probe-mismatch\ndescription: "Use when foo%s\nmodel: sonnet\neffort: high\ntools: Read, Grep, Glob\n---\n\nProbe agent for CI only.\n' \
            "$q" > agents/zz-probe-mismatch.md
          ./install.sh codex >/dev/null
          expected="$(printf 'description = "\\"Use when foo%s"' "$q")"
          grep -qF "$expected" "$HOME/.codex/agents/zz-probe-mismatch.toml" || {
            echo "FAIL: mismatched-delimiter value did not survive verbatim into the Codex render"
            cat "$HOME/.codex/agents/zz-probe-mismatch.toml"; exit 1; }
          rm -f agents/zz-probe-mismatch.md
          # Negative control. The loud abort is the load-bearing half of the
          # decode design, since a user running the installer locally has no CI
          # in the loop to catch a silently corrupted render. Checked per field
          # and per renderer, because only a call site can mask the abort: a
          # nested command substitution hides the inner exit status from set -e.
          # `claude` is not covered because it copies agents verbatim.
          probe_abort() {
            if [ "$1" = description ]; then
              d='"Use when testing an unhandled escape \qhere"'; t='Read, Grep, Glob'
            else
              d='Use when testing an unhandled escape in the tools field'; t='"Read, Grep\qGlob"'
            fi
            printf -- '---\nname: zz-probe-abort\ndescription: %s\nmodel: sonnet\neffort: high\ntools: %s\n---\n\nProbe agent for CI only.\n' \
              "$d" "$t" > agents/zz-probe-abort.md
            if ./install.sh "$2" >/dev/null 2>"$RUNNER_TEMP/abort-$1-$2.err"; then
              echo "FAIL: unhandled escape in $1 did not abort ./install.sh $2"; exit 1
            fi
            grep -q 'unhandled escape' "$RUNNER_TEMP/abort-$1-$2.err" \
              || { echo "FAIL: no unhandled-escape diagnostic for $1 on $2"; exit 1; }
            rm -f agents/zz-probe-abort.md
          }
          for f in description tools; do
            for t in codex copilot; do probe_abort "$f" "$t"; done
          done
      - name: Office skills installer (stubbed fetch, no network)
        run: |
          set -euo pipefail
          stub_bin="$RUNNER_TEMP/office-stub-bin"
          mkdir -p "$stub_bin"
          cat > "$stub_bin/npx" <<'STUB'
          #!/usr/bin/env bash
          # Fakes `npx skills add ... --agent <id> -g ...`'s output shape without
          # hitting the network, so this test exercises install-office-skills.sh's
          # own detection/dispatch logic deterministically. Reads --agent from its
          # own args and routes to the same directories the real skills CLI uses:
          # claude-code -> ~/.claude/skills, codex/github-copilot -> the shared
          # ~/.agents/skills. Requires -g so a future regression that drops the
          # global flag from the real script fails this test instead of passing.
          agent=""
          global=false
          while [ $# -gt 0 ]; do
            case "$1" in
              --agent) agent="$2"; shift 2 ;;
              -g) global=true; shift ;;
              *) shift ;;
            esac
          done
          $global || { echo "stub: expected -g (global install) but it was not passed" >&2; exit 1; }
          case "$agent" in
            claude-code) dest="$HOME/.claude/skills" ;;
            codex|github-copilot) dest="$HOME/.agents/skills" ;;
            *) echo "stub: unknown --agent $agent" >&2; exit 1 ;;
          esac
          echo "$agent" >> "$HOME/agent-invocations.log"
          for s in docx pdf pptx xlsx; do
            mkdir -p "$dest/$s"
            printf -- '---\nname: %s\ndescription: stub\n---\n# stub\n' "$s" > "$dest/$s/SKILL.md"
          done
          STUB
          chmod +x "$stub_bin/npx"
          printf '#!/usr/bin/env bash\n' > "$stub_bin/claude"; chmod +x "$stub_bin/claude"
          printf '#!/usr/bin/env bash\n' > "$stub_bin/codex"; chmod +x "$stub_bin/codex"
          export HOME="$RUNNER_TEMP/scratch-home-office"; mkdir -p "$HOME/.copilot"
          export PATH="$stub_bin:$PATH"
          ./install-office-skills.sh
          ./install-office-skills.sh   # rerun: must not fail
          for s in docx pdf pptx xlsx; do
            test -f "$HOME/.claude/skills/$s/SKILL.md" \
              || { echo "FAIL: missing $HOME/.claude/skills/$s/SKILL.md"; exit 1; }
            test -f "$HOME/.agents/skills/$s/SKILL.md" \
              || { echo "FAIL: missing $HOME/.agents/skills/$s/SKILL.md"; exit 1; }
          done
          # Codex and GitHub Copilot both write the shared .agents/skills tree, so
          # the file-existence checks above pass even if one of the two dispatch
          # branches is silently removed. Assert each agent was actually invoked.
          for a in claude-code codex github-copilot; do
            grep -qx "$a" "$HOME/agent-invocations.log" \
              || { echo "FAIL: $a was never invoked"; exit 1; }
          done
      - name: Office skills uninstall (no network, no npx)
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home-office"
          # .claude/skills and .agents/skills already carry the four office
          # skills from the install step above; .copilot/skills needs seeding
          # directly since the stub's github-copilot route never writes there.
          mkdir -p "$HOME/.copilot/skills"
          for s in docx pdf pptx xlsx; do
            mkdir -p "$HOME/.copilot/skills/$s"
            printf -- '---\nname: %s\ndescription: stub\n---\n# stub\n' "$s" > "$HOME/.copilot/skills/$s/SKILL.md"
          done
          # A decoy repo-owned skill plus its manifest record and an empty
          # pruned-attic dir, seeded in the one destination install.sh
          # actually manages: uninstall must never touch any of the three.
          decoy="$HOME/.claude/skills/zz-decoy-skill"
          mkdir -p "$decoy"
          printf -- '---\nname: zz-decoy-skill\ndescription: decoy\n---\n# decoy\n' > "$decoy/SKILL.md"
          manifest="$HOME/.claude/skills/.plan-and-track-manifest"
          echo "zz-decoy-skill" >> "$manifest"
          mkdir -p "$HOME/.claude/skills/.plan-and-track-pruned"
          # Establish presence before asserting absence. Two of the three
          # destinations are seeded by the install step above rather than
          # here, so without this the post-uninstall test would pass against
          # a skill that was never there and check nothing.
          for dest in "$HOME/.claude/skills" "$HOME/.agents/skills" "$HOME/.copilot/skills"; do
            for s in docx pdf pptx xlsx; do
              test -e "$dest/$s" \
                || { echo "FAIL: $dest/$s absent before uninstall; the absence check below would be vacuous"; exit 1; }
            done
          done
          # PATH stripped to bare coreutils, no npx anywhere on it: proves
          # uninstall needs neither network nor the third-party skills CLI.
          export PATH="/usr/bin:/bin"
          ./install-office-skills.sh uninstall
          for dest in "$HOME/.claude/skills" "$HOME/.agents/skills" "$HOME/.copilot/skills"; do
            for s in docx pdf pptx xlsx; do
              test ! -e "$dest/$s" \
                || { echo "FAIL: $dest/$s survived uninstall"; exit 1; }
            done
          done
          test -f "$decoy/SKILL.md" \
            || { echo "FAIL: uninstall deleted the decoy skill it must never touch"; exit 1; }
          test -f "$manifest" \
            || { echo "FAIL: uninstall deleted .plan-and-track-manifest"; exit 1; }
          grep -qx zz-decoy-skill "$manifest" \
            || { echo "FAIL: .plan-and-track-manifest content changed"; exit 1; }
          test -d "$HOME/.claude/skills/.plan-and-track-pruned" \
            || { echo "FAIL: uninstall deleted .plan-and-track-pruned"; exit 1; }
          ./install-office-skills.sh uninstall   # rerun: must exit 0
      - name: Stale prune quarantines removed repo copies, never non-repo content
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home"
          skills="$HOME/.claude/skills"
          manifest="$skills/.plan-and-track-manifest"
          test -f "$manifest" || { echo "FAIL: manifest missing after install"; exit 1; }
          # 1. Repo-owned skill whose source was since removed: on disk AND recorded
          #    in the manifest, but absent from the current repo skill set -> prune.
          mkdir -p "$skills/zz-stale-skill"
          printf -- '---\nname: zz-stale-skill\ndescription: stale\n---\n' > "$skills/zz-stale-skill/SKILL.md"
          echo "zz-stale-skill" >> "$manifest"
          # 2. User-added skill: on disk, NOT in the manifest -> must survive.
          mkdir -p "$skills/zz-user-skill"; echo keep > "$skills/zz-user-skill/SKILL.md"
          # 3. Stub office skill: on disk, NOT in the manifest -> must survive.
          mkdir -p "$skills/docx"; echo office > "$skills/docx/SKILL.md"
          # 4. Symlink at a manifest-recorded (repo-owned) name pointing OUTSIDE the
          #    tree: prune must remove the link but never follow into the target.
          ext="$RUNNER_TEMP/external-precious"; mkdir -p "$ext"; echo precious > "$ext/data.txt"
          ln -s "$ext" "$skills/zz-linked-skill"
          echo "zz-linked-skill" >> "$manifest"
          out="$(./install.sh claude)"; echo "$out"
          attic="$skills/.plan-and-track-pruned"
          test ! -e "$skills/zz-stale-skill" || { echo "FAIL: stale skill still present"; exit 1; }
          test -f "$attic/zz-stale-skill/SKILL.md" || { echo "FAIL: stale skill not quarantined"; exit 1; }
          test -f "$skills/zz-user-skill/SKILL.md" || { echo "FAIL: user skill was pruned"; exit 1; }
          test -f "$skills/docx/SKILL.md" || { echo "FAIL: office skill was pruned"; exit 1; }
          test ! -e "$skills/zz-linked-skill" || { echo "FAIL: stale symlink not pruned"; exit 1; }
          { test -f "$ext/data.txt" && grep -q precious "$ext/data.txt"; } || { echo "FAIL: symlink target destroyed"; exit 1; }
          out2="$(./install.sh claude)"; echo "$out2"
          echo "$out2" | grep -q 'repo source removed' && { echo "FAIL: no-change rerun pruned something"; exit 1; } || true
          cmp -s "skills/plan-and-track/SKILL.md" "$skills/plan-and-track/SKILL.md" || { echo "FAIL: real skill not byte-identical after prune"; exit 1; }
          echo "OK: stale copy quarantined; user/office/symlink-target survived; rerun pruned nothing"

      - name: Symlinked attic or manifest is refused, external content survives
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home-guard"
          mkdir -p "$HOME"
          ./install.sh claude >/dev/null
          skills="$HOME/.claude/skills"
          manifest="$skills/.plan-and-track-manifest"
          # A stale name so the prune has work to do.
          mkdir -p "$skills/zz-stale-skill"; echo stale > "$skills/zz-stale-skill/SKILL.md"
          echo "zz-stale-skill" >> "$manifest"
          # A) Attic is a symlink to an external dir holding an identically-named
          #    entry: the guard must refuse, never rm -rf/mv into the target.
          ext="$RUNNER_TEMP/ext-attic"; mkdir -p "$ext/zz-stale-skill"; echo canary > "$ext/zz-stale-skill/keep"
          ln -s "$ext" "$skills/.plan-and-track-pruned"
          ./install.sh claude >/dev/null 2>"$RUNNER_TEMP/guardA.err" || true
          test -f "$ext/zz-stale-skill/keep" || { echo "FAIL: external attic content deleted"; exit 1; }
          test -d "$skills/zz-stale-skill" || { echo "FAIL: stale skill moved despite bad attic"; exit 1; }
          grep -q 'is a symlink' "$RUNNER_TEMP/guardA.err" || { echo "FAIL: no attic-symlink warning"; exit 1; }
          rm -f "$skills/.plan-and-track-pruned"
          # B) Manifest is a symlink to an external file: the guard must refuse,
          #    never rewrite through the link.
          extm="$RUNNER_TEMP/ext-manifest"; echo EXTERNAL > "$extm"
          rm -f "$manifest"; ln -s "$extm" "$manifest"
          ./install.sh claude >/dev/null 2>"$RUNNER_TEMP/guardB.err" || true
          grep -qx EXTERNAL "$extm" || { echo "FAIL: external manifest overwritten"; exit 1; }
          grep -q 'is a symlink' "$RUNNER_TEMP/guardB.err" || { echo "FAIL: no manifest-symlink warning"; exit 1; }
          echo "OK: symlinked attic and manifest refused; external content untouched"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tooling versions
        shell: powershell
        run: $PSVersionTable.PSVersion; node --version
      - name: Install twice (idempotent) into a scratch USERPROFILE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          .\install.ps1 all
          # install.ps1 reports via Write-Host (Information stream); 6>&1 folds
          # that into the pipeline so Out-String can capture it for the assertion.
          $out = (.\install.ps1 all 6>&1 | Out-String)
          Write-Host $out
          if ($out -notmatch 'digest hook\s+-- already present') {
            throw "digest hook not detected as already present on re-run"
          }
      - name: Assert layout, defaults, and hook wiring
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home"
          $H = $env:USERPROFILE
          $need = @(
            "$H\.claude\scripts\core-rules-digest.js",
            "$H\.claude\scripts\gateguard.js",
            "$H\.claude\scripts\delivery-gate.js",
            "$H\.claude\scripts\suggest-compact.js",
            "$H\.claude\scripts\plan-gate.js",
            "$H\.codex\scripts\core-rules-digest.js",
            "$H\.codex\scripts\plan-gate.js",
            "$H\.copilot\scripts\core-rules-digest.js",
            "$H\.claude\CLAUDE.md", "$H\.codex\AGENTS.md",
            "$H\.copilot\copilot-instructions.md"
          )
          foreach ($f in $need) { if (-not (Test-Path -LiteralPath $f)) { throw "missing $f" } }
          $s = Get-Content -Raw "$H\.claude\settings.json" | ConvertFrom-Json
          if ($s.model -ne 'opusplan') { throw "model != opusplan" }
          if ($s.switchModelsOnFlag -ne $true) { throw "switchModelsOnFlag != true" }
          function Assert-BarePermissionPosture($h) {
            $j = Get-Content -Raw (Join-Path $h '.claude\settings.json') | ConvertFrom-Json
            $dm = $null
            if ($j.PSObject.Properties.Name -contains 'permissions' -and $j.permissions.PSObject.Properties.Name -contains 'defaultMode') { $dm = $j.permissions.defaultMode }
            $skip = $null
            if ($j.PSObject.Properties.Name -contains 'skipDangerousModePermissionPrompt') { $skip = $j.skipDangerousModePermissionPrompt }
            $plugin = $null
            if ($j.PSObject.Properties.Name -contains 'enabledPlugins' -and $j.enabledPlugins.PSObject.Properties.Name -contains 'frontend-design@claude-plugins-official') { $plugin = $j.enabledPlugins.'frontend-design@claude-plugins-official' }
            if ($null -ne $dm -or $null -ne $skip -or $plugin -ne $false) {
              throw "bare install permission posture violated (defaultMode=$dm skip=$skip plugin=$plugin)"
            }
          }
          Assert-BarePermissionPosture $H
          $c = (Get-Content -Raw "$H\.copilot\settings.json" | ConvertFrom-Json).model
          if ($c -ne 'auto') { throw "copilot model != auto" }
          if ((Get-Content -Raw "$H\.codex\config.toml") -notmatch 'plan_mode_reasoning_effort = "xhigh"') { throw "codex effort missing" }
          if ((Get-Content -Raw "$H\.claude\CLAUDE.md") -notmatch 'agent-plan-and-track:begin') { throw "managed block missing" }
          if (-not (Test-Path -LiteralPath "$H\.claude\skills\skill-comply\SKILL.md")) { throw "Claude skill-comply missing" }
          if (-not (Test-Path -LiteralPath "$H\.agents\skills\skill-comply\SKILL.md")) { throw "Codex skill-comply missing" }
          if (Test-Path -LiteralPath "$H\.copilot\skills\skill-comply") { throw "Copilot unexpectedly installed skill-comply" }
          # No unresolved placeholder leaked into any installed config.
          $leak = Get-ChildItem -Recurse -File "$H\.claude","$H\.codex","$H\.copilot" |
                  Select-String -SimpleMatch '__SCRIPTS__' -List
          if ($leak) { throw "__SCRIPTS__ placeholder leaked into installed files" }
          # Digest hook command points at a script that exists, merged exactly once.
          $cmd = $s.hooks.UserPromptSubmit[0].hooks[0].command
          if ($cmd -notmatch 'core-rules-digest\.js') { throw "digest command missing" }
          $baked = ($cmd -replace '^node "([^"]+)".*', '$1')
          if (-not (Test-Path -LiteralPath $baked)) { throw "baked hook path does not exist: $baked" }
          # Only the digest hook command references the digest script, so a raw
          # string count of 1 proves it was merged exactly once (no double-merge).
          $raw = Get-Content -Raw "$H\.claude\settings.json"
          $n = ([regex]::Matches($raw, 'core-rules-digest')).Count
          if ($n -ne 1) { throw "expected 1 digest hook, found $n" }
          function Assert-CodexPlanGate {
            $codexRaw = Get-Content -Raw "$H\.codex\hooks.json"
            $codexHooks = $codexRaw | ConvertFrom-Json
            $applyPre = @($codexHooks.hooks.PreToolUse | Where-Object { $_.matcher -eq 'apply_patch' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js.*--pre' }).Count
            $bashPre = @($codexHooks.hooks.PreToolUse | Where-Object { $_.matcher -eq 'Bash' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js.*--pre' }).Count
            $applyPost = @($codexHooks.hooks.PostToolUse | Where-Object { $_.matcher -eq 'apply_patch' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js.*--post' }).Count
            $total = ([regex]::Matches($codexRaw, 'plan-gate\.js')).Count
            if ($applyPre -ne 1 -or $bashPre -ne 1 -or $applyPost -ne 1 -or $total -ne 3) {
              throw "Codex plan-gate entries apply-pre=$applyPre bash-pre=$bashPre apply-post=$applyPost total=$total"
            }
          }
          Assert-CodexPlanGate
          foreach ($missing in @('apply-pre', 'bash-pre', 'apply-post')) {
            $codexHooks = Get-Content -Raw "$H\.codex\hooks.json" | ConvertFrom-Json
            if ($missing -eq 'apply-post') {
              $codexHooks.hooks.PostToolUse = @($codexHooks.hooks.PostToolUse | Where-Object {
                -not ($_.matcher -eq 'apply_patch' -and @($_.hooks | Where-Object { $_.command -match 'plan-gate\.js.*--post' }).Count -gt 0)
              })
            } else {
              $matcher = if ($missing -eq 'apply-pre') { 'apply_patch' } else { 'Bash' }
              $codexHooks.hooks.PreToolUse = @($codexHooks.hooks.PreToolUse | Where-Object {
                -not ($_.matcher -eq $matcher -and @($_.hooks | Where-Object { $_.command -match 'plan-gate\.js.*--pre' }).Count -gt 0)
              })
            }
            [System.IO.File]::WriteAllText("$H\.codex\hooks.json", ($codexHooks | ConvertTo-Json -Depth 16), [System.Text.UTF8Encoding]::new($false))
            $repairOut = (.\install.ps1 codex 6>&1 | Out-String)
            if ($repairOut -notmatch 'plan-gate hook\s+-> repaired') { throw "Codex installer did not report $missing repair" }
            Assert-CodexPlanGate
          }
          $idempotentOut = (.\install.ps1 codex 6>&1 | Out-String)
          if ($idempotentOut -notmatch 'plan-gate hook\s+-- already present') { throw "Codex plan-gate entries not idempotent" }
          Assert-CodexPlanGate
          # Claude plan-gate: two additive PreToolUse entries on the same command
          # (Skill|Edit|Write|MultiEdit for the stamp/scope/lint gates, Bash for
          # the mutation gate), each checked and repaired per entry like the
          # Codex entries above.
          $claudeSettings = Get-Content -Raw "$H\.claude\settings.json" | ConvertFrom-Json
          $stampCount = @($claudeSettings.hooks.PreToolUse | Where-Object { $_.matcher -eq 'Skill|Edit|Write|MultiEdit' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js' }).Count
          if ($stampCount -ne 1) { throw "expected 1 Claude plan-gate stamp PreToolUse entry, found $stampCount" }
          $bashCount = @($claudeSettings.hooks.PreToolUse | Where-Object { $_.matcher -eq 'Bash' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js' }).Count
          if ($bashCount -ne 1) { throw "expected 1 Claude plan-gate Bash PreToolUse entry, found $bashCount" }
          $claudeSettings.hooks.PreToolUse = @($claudeSettings.hooks.PreToolUse | Where-Object { $_.matcher -ne 'Bash' })
          [System.IO.File]::WriteAllText("$H\.claude\settings.json", ($claudeSettings | ConvertTo-Json -Depth 16), [System.Text.UTF8Encoding]::new($false))
          .\install.ps1 claude | Out-Null
          $claudeSettings = Get-Content -Raw "$H\.claude\settings.json" | ConvertFrom-Json
          $hasPlanBash = @($claudeSettings.hooks.PreToolUse | Where-Object { $_.matcher -eq 'Bash' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js' }).Count -gt 0
          if (-not $hasPlanBash) { throw "Claude installer did not re-add the deleted plan-gate Bash entry" }
          # Codex TOML agents: one rendered file per agents/*.md source.
          $agentMdCount = (Get-ChildItem 'agents\*.md').Count
          $agentTomlCount = (Get-ChildItem "$H\.codex\agents\*.toml").Count
          if ($agentTomlCount -ne $agentMdCount) { throw "expected $agentMdCount Codex agent TOML files, found $agentTomlCount" }
          # Each rendered TOML must actually parse and carry exactly the expected
          # keys, with no stray Claude `model` key (existence/count alone doesn't
          # prove the renderer emitted valid or complete output).
          $validatorLines = @(
            'import glob, os, sys, tomllib',
            'expected = {"name", "description", "model_reasoning_effort", "sandbox_mode", "developer_instructions"}',
            'files = sorted(glob.glob(os.path.join(sys.argv[1], "*.toml")))',
            'assert files, "no Codex agent TOML files found"',
            'bad = [(f, sorted(tomllib.load(open(f, "rb")).keys())) for f in files if set(tomllib.load(open(f, "rb")).keys()) != expected]',
            'assert not bad, f"bad TOML key sets: {bad}"',
            'print(f"OK: validated TOML structure for {len(files)} rendered Codex agents")'
          )
          $validatorPath = Join-Path $env:RUNNER_TEMP 'validate_codex_toml.py'
          Set-Content -Path $validatorPath -Value $validatorLines -Encoding utf8
          python $validatorPath "$H\.codex\agents"
          if ($LASTEXITCODE -ne 0) { throw "Codex TOML validation failed" }
          # Copilot agents: one rendered file per agents/*.md source.
          $copilotAgentCount = (Get-ChildItem "$H\.copilot\agents\*.agent.md").Count
          if ($copilotAgentCount -ne $agentMdCount) { throw "expected $agentMdCount Copilot agent files, found $copilotAgentCount" }
          # Mapping spot-check on the rendered executor agent: expected tool
          # aliases, fenced frontmatter, and neither Claude's model nor effort key
          # (the Copilot render deliberately omits both).
          $executorAgent = "$H\.copilot\agents\executor.agent.md"
          $executorContent = Get-Content -Raw $executorAgent
          if ($executorContent -notmatch [regex]::Escape('tools: ["read", "search", "edit", "execute"]')) { throw "executor.agent.md missing expected tools mapping" }
          $firstLine = (Get-Content $executorAgent -TotalCount 1)
          if ($firstLine -ne '---') { throw "executor.agent.md does not start with a --- fence" }
          if ($executorContent -match '(?m)^model:') { throw "executor.agent.md unexpectedly carries a model: line" }
          if ($executorContent -match '(?m)^effort:') { throw "executor.agent.md unexpectedly carries an effort: line" }
      - name: Permission posture is opt-in only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Duplicated verbatim from the "Assert layout, defaults, and hook wiring"
          # step: each run: block is its own process, so a function defined there
          # does not exist here. Edit both copies together.
          function Assert-BarePermissionPosture($h) {
            $j = Get-Content -Raw (Join-Path $h '.claude\settings.json') | ConvertFrom-Json
            $dm = $null
            if ($j.PSObject.Properties.Name -contains 'permissions' -and $j.permissions.PSObject.Properties.Name -contains 'defaultMode') { $dm = $j.permissions.defaultMode }
            $skip = $null
            if ($j.PSObject.Properties.Name -contains 'skipDangerousModePermissionPrompt') { $skip = $j.skipDangerousModePermissionPrompt }
            $plugin = $null
            if ($j.PSObject.Properties.Name -contains 'enabledPlugins' -and $j.enabledPlugins.PSObject.Properties.Name -contains 'frontend-design@claude-plugins-official') { $plugin = $j.enabledPlugins.'frontend-design@claude-plugins-official' }
            if ($null -ne $dm -or $null -ne $skip -or $plugin -ne $false) {
              throw "bare install permission posture violated (defaultMode=$dm skip=$skip plugin=$plugin)"
            }
          }
          # 1. Opt-in: with the variable set, the Claude target must set all three keys.
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-bypass-optin"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          $env:PT_BYPASS_PERMISSIONS = '1'
          .\install.ps1 claude | Out-Null
          Remove-Item Env:PT_BYPASS_PERMISSIONS -ErrorAction SilentlyContinue
          $s = Get-Content -Raw "$env:USERPROFILE\.claude\settings.json" | ConvertFrom-Json
          if ($s.permissions.defaultMode -ne 'bypassPermissions') { throw "opt-in install did not set defaultMode" }
          if ($s.skipDangerousModePermissionPrompt -ne $true) { throw "opt-in install did not set skip flag" }
          if ($s.enabledPlugins.'frontend-design@claude-plugins-official' -ne $false) { throw "opt-in install did not disable the plugin" }
          # 2. Survival: a pre-existing stricter posture and an unrelated plugin
          # entry must survive a BARE install untouched, aside from the plugin disable.
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-bypass-survival"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.claude" | Out-Null
          Set-Content -Path "$env:USERPROFILE\.claude\settings.json" -Value '{"permissions":{"defaultMode":"default"},"enabledPlugins":{"life@laerdal":true}}'
          .\install.ps1 claude | Out-Null
          $s = Get-Content -Raw "$env:USERPROFILE\.claude\settings.json" | ConvertFrom-Json
          if ($s.permissions.defaultMode -ne 'default') { throw "bare install altered a pre-existing defaultMode" }
          if ($s.PSObject.Properties.Name -contains 'skipDangerousModePermissionPrompt') { throw "bare install added the skip flag" }
          if ($s.enabledPlugins.'frontend-design@claude-plugins-official' -ne $false) { throw "bare install did not disable the plugin" }
          if ($s.enabledPlugins.'life@laerdal' -ne $true) { throw "bare install disturbed an unrelated plugin entry" }
          # 3. Negative control: prove part A's assertion is not vacuous by running
          # it against a home whose settings deliberately already carry both bypass keys.
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-bypass-negctrl"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.claude" | Out-Null
          Set-Content -Path "$env:USERPROFILE\.claude\settings.json" -Value '{"permissions":{"defaultMode":"bypassPermissions"},"skipDangerousModePermissionPrompt":true,"enabledPlugins":{"frontend-design@claude-plugins-official":false}}'
          $violated = $false
          try { Assert-BarePermissionPosture $env:USERPROFILE } catch { $violated = $true }
          if (-not $violated) { throw "Assert-BarePermissionPosture passed against a fixture that deliberately carries both bypass keys" }
          Write-Host "OK: the bare-posture assertion rejects a settings file carrying the bypass keys"
      - name: Shared Node scripts run
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home"
          $H = $env:USERPROFILE
          # PowerShell does not turn a native nonzero exit into a terminating
          # error, and each call overwrites $LASTEXITCODE, so check after every one.
          function Assert-Node($label) { if ($LASTEXITCODE -ne 0) { throw "$label exited $LASTEXITCODE" } }
          $digest = (node "$H\.claude\scripts\core-rules-digest.js" | Out-String); Assert-Node 'digest'
          if ($digest.Trim().Length -eq 0) { throw "digest produced no output" }
          node "$H\.copilot\scripts\core-rules-digest.js" --copilot | Out-Null; Assert-Node 'copilot digest'
          node skills\skill-activation\scripts\run-activation-cases.js --dry-run | Out-Null; Assert-Node 'run-activation --dry-run'
          node skills\skill-activation\scripts\run-activation-cases.js --precheck "$H\.claude\skills" | Out-Null; Assert-Node 'run-activation --precheck'
          node skills\skill-activation\scripts\run-activation-cases.js --precheck-agents agents "$H" | Out-Null; Assert-Node 'run-activation --precheck-agents'
          node skills\skill-activation\scripts\run-behavioral-smokes.js --dry-run | Out-Null; Assert-Node 'run-behavioral-smokes --dry-run'
          node skills\skill-activation\scripts\run-live-runner-fixtures.js | Out-Null; Assert-Node 'live runner fixtures'
          node skills\context-budget\scripts\scan-context.js .\skills | Out-Null; Assert-Node 'scan-context'
          node skills\skill-comply\scripts\run-codex-cases.js --dry-run | Out-Null; Assert-Node 'skill-comply Codex dry-run'
          node hooks\codex\scripts\run-plan-gate-pilot-fixtures.js | Out-Null; Assert-Node 'Codex plan-gate fixtures'
          node hooks\claude\scripts\run-plan-gate-fixtures.js | Out-Null; Assert-Node 'Claude plan-gate fixtures'
          node skills\rules-distill\scripts\scan-rules.js | Out-Null; Assert-Node 'scan-rules'
          node skills\rules-distill\scripts\scan-skills.js .\skills | Out-Null; Assert-Node 'scan-skills'
          node .github\scripts\run-lint-pr-body-fixtures.js | Out-Null; Assert-Node 'lint-pr-body fixtures'
          node .github\scripts\check-digest-preview.js | Out-Null; Assert-Node 'check-digest-preview'
          node .github\scripts\run-check-digest-preview-fixtures.js | Out-Null; Assert-Node 'check-digest-preview fixtures'
      - name: Probe-agent frontmatter escape/quote round-trip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home"
          $H = $env:USERPROFILE
          # Probe files are written BOM-less, the same reason install.ps1
          # defines $Utf8NoBom: Windows PowerShell 5.1's -Encoding utf8 always
          # emits a BOM, and while install.ps1 reads through ReadAllLines and
          # never sees it, the Node comparator below compares its fence lines
          # with `line === '---'` and would read `﻿---` instead.
          $Utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $repo = (Get-Location).Path
          function Write-Probe($relPath, $text) {
            [System.IO.File]::WriteAllText((Join-Path $repo $relPath), $text, $Utf8NoBom)
          }
          # Two throwaway agents/*.md sources exercising the two frontmatter
          # defects Get-AgentFrontmatterField's decode covers: a single-quoted
          # description with a doubled '' escape, and a double-quoted one with
          # a \" escape. Removed at the end of this step; never committed.
          $probeSingle = @'
          ---
          name: zz-probe-single
          description: 'Use when: the value has an apostrophe, like don''t skip this step.'
          model: sonnet
          effort: high
          tools: Read, Grep, Glob
          ---

          Probe agent for CI only; removed at the end of this step.
          '@
          $probeEscape = @'
          ---
          name: zz-probe-escape
          description: "Use when: the value says \"hello\" and has a backslash before an escaped quote \\\" like that."
          model: sonnet
          effort: high
          tools: Read, Grep, Glob
          ---

          Probe agent for CI only; removed at the end of this step.
          '@
          Write-Probe 'agents\zz-probe-single.md' $probeSingle
          Write-Probe 'agents\zz-probe-escape.md' $probeEscape
          .\install.ps1 claude | Out-Null
          .\install.ps1 codex | Out-Null
          .\install.ps1 copilot | Out-Null
          # The decoded description must round-trip identically into all three
          # rendered formats (Claude copy, Codex TOML, Copilot .agent.md).
          node skills\skill-activation\scripts\run-activation-cases.js --precheck-agents agents "$H" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "probe-agent description did not round-trip through --precheck-agents" }
          # The Copilot render's tools value must be a YAML flow array, not a
          # bare or leaked-quote string.
          $probeContent = Get-Content -Raw "$H\.copilot\agents\zz-probe-single.agent.md"
          if ($probeContent -notmatch [regex]::Escape('tools: ["read", "search"]')) { throw "zz-probe-single.agent.md missing expected YAML flow array tools" }
          Remove-Item -LiteralPath 'agents\zz-probe-single.md' -Force
          Remove-Item -LiteralPath 'agents\zz-probe-escape.md' -Force
          # New defect: a value whose backslash escapes something the
          # installers cannot render (a tab) is legal YAML, so it would abort
          # the installers even though it passes frontmatter_invalid_yaml;
          # --precheck-agents must reject it before it ever reaches disk.
          $probeUninstallable = @'
          ---
          name: zz-probe-uninstallable
          description: "Use when: testing an uninstallable escape \t here."
          model: sonnet
          effort: high
          tools: Read, Grep, Glob
          ---

          Probe agent for CI only; removed at the end of this step.
          '@
          Write-Probe 'agents\zz-probe-uninstallable.md' $probeUninstallable
          # No installed-home argument on purpose, mirroring the unix job. This
          # probe is never installed, so passing one would make all three
          # description-match flags false and the run would exit nonzero
          # whatever the new check did, which is a vacuous test. Source-only,
          # then attribute the rejection to the flag by name.
          $probeOut = "$env:RUNNER_TEMP\uninstallable-probe.json"
          node skills\skill-activation\scripts\run-activation-cases.js --precheck-agents agents > $probeOut 2>&1
          if ($LASTEXITCODE -eq 0) { throw "--precheck-agents accepted an uninstallable \t escape" }
          if ((Get-Content -Raw $probeOut) -notmatch [regex]::Escape('"frontmatter_uninstallable_escape": true')) {
            throw "rejection was not attributed to frontmatter_uninstallable_escape"
          }
          Remove-Item -LiteralPath 'agents\zz-probe-uninstallable.md' -Force
          # Third defect: a value whose two ends are different quotes must come
          # back byte-verbatim rather than have each end stripped on its own.
          # Asserted against the render directly, not through
          # --precheck-agents, which flags such a value as invalid frontmatter
          # by design, and after the probes above are removed so it cannot
          # contaminate their round-trip check.
          $q = "'"
          $mismatchLines = @('---', 'name: zz-probe-mismatch', "description: `"Use when foo$q", 'model: sonnet', 'effort: high', 'tools: Read, Grep, Glob', '---', '', 'Probe agent for CI only.')
          Write-Probe 'agents\zz-probe-mismatch.md' (($mismatchLines -join "`n") + "`n")
          .\install.ps1 codex | Out-Null
          $mismatchToml = Get-Content -Raw "$H\.codex\agents\zz-probe-mismatch.toml"
          $expectedMismatch = 'description = "\"Use when foo' + $q + '"'
          if ($mismatchToml -notmatch [regex]::Escape($expectedMismatch)) {
            throw "mismatched-delimiter value did not survive verbatim into the Codex render"
          }
          Remove-Item -LiteralPath 'agents\zz-probe-mismatch.md' -Force
          # Negative control, mirroring the unix job. The loud abort is the
          # load-bearing half of the decode design, since a user running the
          # installer locally has no CI in the loop to catch a silently
          # corrupted render. Checked per field and per renderer; `claude` is
          # not covered because it copies agents verbatim.
          function Test-AbortOnBadEscape($field, $target) {
            if ($field -eq 'description') {
              $d = '"Use when testing an unhandled escape \qhere"'; $t = 'Read, Grep, Glob'
            } else {
              $d = 'Use when testing an unhandled escape in the tools field'; $t = '"Read, Grep\qGlob"'
            }
            $lines = @('---', 'name: zz-probe-abort', "description: $d", 'model: sonnet', 'effort: high', "tools: $t", '---', '', 'Probe agent for CI only.')
            Write-Probe 'agents\zz-probe-abort.md' (($lines -join "`n") + "`n")
            $aborted = $false
            try { & .\install.ps1 $target | Out-Null } catch {
              # Assert the reason, matching the unix job's stderr grep. Catching
              # any terminating error would pass on an unrelated failure and
              # make this control vacuous.
              if ($_.Exception.Message -notmatch 'unhandled escape') { throw "aborted for the wrong reason: $_" }
              $aborted = $true
            }
            if (-not $aborted) { throw "unhandled escape in $field did not abort .\install.ps1 $target" }
            Remove-Item -LiteralPath 'agents\zz-probe-abort.md' -Force
          }
          foreach ($f in @('description', 'tools')) {
            foreach ($t in @('codex', 'copilot')) { Test-AbortOnBadEscape $f $t }
          }
      - name: Office skills installer (stubbed fetch, no network)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stubBin = Join-Path $env:RUNNER_TEMP 'office-stub-bin'
          New-Item -ItemType Directory -Force -Path $stubBin | Out-Null
          # Fakes `npx skills add ... --agent <id> -g ...`'s output shape without
          # hitting the network, so this test exercises install-office-skills.ps1's
          # own detection/dispatch logic deterministically. The actual routing
          # logic lives in a PowerShell child script (easier to get right than
          # cmd.exe batch argument parsing); npx.cmd is just a launcher, since
          # only .cmd/.exe are resolved via PATH by default. Reads --agent from
          # its own args and routes to the same directories the real skills CLI
          # uses: claude-code -> %USERPROFILE%\.claude\skills, codex/github-copilot
          # -> the shared %USERPROFILE%\.agents\skills. Requires -g so a future
          # regression that drops the global flag from the real script fails this
          # test instead of passing.
          @'
          @echo off
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0npx-stub.ps1" %*
          '@ | Set-Content -Path (Join-Path $stubBin 'npx.cmd') -Encoding ascii
          @'
          $argsStr = $args -join " "
          if ($argsStr -notmatch "(^| )-g( |$)") {
            Write-Error "stub: expected -g (global install) but it was not passed"
            exit 1
          }
          if ($argsStr -notmatch "--agent (\S+)") {
            Write-Error "stub: no --agent found in '$argsStr'"
            exit 1
          }
          $agent = $matches[1]
          if ($agent -eq "claude-code") {
            $dest = Join-Path $env:USERPROFILE ".claude\skills"
          } elseif ($agent -eq "codex" -or $agent -eq "github-copilot") {
            $dest = Join-Path $env:USERPROFILE ".agents\skills"
          } else {
            Write-Error "stub: unknown --agent '$agent'"
            exit 1
          }
          Add-Content -Path (Join-Path $env:USERPROFILE "agent-invocations.log") -Value $agent
          foreach ($s in @("docx", "pdf", "pptx", "xlsx")) {
            New-Item -ItemType Directory -Force -Path (Join-Path $dest $s) | Out-Null
            Set-Content -Path (Join-Path $dest "$s\SKILL.md") -Value "stub"
          }
          exit 0
          '@ | Set-Content -Path (Join-Path $stubBin 'npx-stub.ps1') -Encoding ascii
          '@echo off' | Set-Content -Path (Join-Path $stubBin 'claude.cmd') -Encoding ascii
          '@echo off' | Set-Content -Path (Join-Path $stubBin 'codex.cmd') -Encoding ascii
          $env:PATH = "$stubBin;$env:PATH"
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-office"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.copilot" | Out-Null
          .\install-office-skills.ps1
          if ($LASTEXITCODE -ne 0) { throw "install-office-skills.ps1 failed with exit code $LASTEXITCODE" }
          .\install-office-skills.ps1   # rerun: must not fail
          if ($LASTEXITCODE -ne 0) { throw "install-office-skills.ps1 (rerun) failed with exit code $LASTEXITCODE" }
          $baseDir = $env:USERPROFILE
          foreach ($harness in @('.claude', '.agents')) {
            foreach ($s in @('docx', 'pdf', 'pptx', 'xlsx')) {
              $p = "$baseDir\$harness\skills\$s\SKILL.md"
              if (-not (Test-Path -LiteralPath $p)) { throw "missing $p" }
            }
          }
          # Codex and GitHub Copilot both write the shared .agents tree, so the
          # file-existence checks above pass even if one dispatch branch is
          # silently removed. Assert each agent was actually invoked.
          $invoked = Get-Content (Join-Path $baseDir "agent-invocations.log")
          foreach ($a in @('claude-code', 'codex', 'github-copilot')) {
            if ($invoked -notcontains $a) { throw "$a was never invoked" }
          }
      - name: Office skills uninstall (no network, no npx)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-office"
          $H = $env:USERPROFILE
          # .claude\skills and .agents\skills already carry the four office
          # skills from the install step above; .copilot\skills needs seeding
          # directly since the stub's github-copilot route never writes there.
          $copilotSkills = Join-Path $H '.copilot\skills'
          New-Item -ItemType Directory -Force -Path $copilotSkills | Out-Null
          foreach ($s in @('docx', 'pdf', 'pptx', 'xlsx')) {
            New-Item -ItemType Directory -Force -Path (Join-Path $copilotSkills $s) | Out-Null
            Set-Content -Path (Join-Path $copilotSkills "$s\SKILL.md") -Value "stub"
          }
          # A decoy repo-owned skill plus its manifest record and an empty
          # pruned-attic dir, seeded in the one destination install.ps1
          # actually manages: uninstall must never touch any of the three.
          $decoy = Join-Path $H '.claude\skills\zz-decoy-skill'
          New-Item -ItemType Directory -Force -Path $decoy | Out-Null
          Set-Content -Path (Join-Path $decoy 'SKILL.md') -Value "decoy"
          $manifest = Join-Path $H '.claude\skills\.plan-and-track-manifest'
          Add-Content -Path $manifest -Value "zz-decoy-skill"
          New-Item -ItemType Directory -Force -Path (Join-Path $H '.claude\skills\.plan-and-track-pruned') | Out-Null
          # Establish presence before asserting absence. Two of the three
          # destinations are seeded by the install step above rather than
          # here, so without this the post-uninstall test would pass against
          # a skill that was never there and check nothing.
          foreach ($dest in @("$H\.claude\skills", "$H\.agents\skills", "$H\.copilot\skills")) {
            foreach ($s in @('docx', 'pdf', 'pptx', 'xlsx')) {
              if (-not (Test-Path -LiteralPath (Join-Path $dest $s))) { throw "$dest\$s absent before uninstall; the absence check below would be vacuous" }
            }
          }
          # PATH stripped to the Windows system directory only, no npx
          # anywhere on it: proves uninstall needs neither network nor the
          # third-party skills CLI.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          .\install-office-skills.ps1 uninstall
          if ($LASTEXITCODE -ne 0) { throw "install-office-skills.ps1 uninstall failed with exit code $LASTEXITCODE" }
          foreach ($dest in @("$H\.claude\skills", "$H\.agents\skills", "$H\.copilot\skills")) {
            foreach ($s in @('docx', 'pdf', 'pptx', 'xlsx')) {
              if (Test-Path -LiteralPath (Join-Path $dest $s)) { throw "$dest\$s survived uninstall" }
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $decoy 'SKILL.md'))) { throw "uninstall deleted the decoy skill it must never touch" }
          if (-not (Test-Path -LiteralPath $manifest)) { throw "uninstall deleted .plan-and-track-manifest" }
          if ((Get-Content -Raw $manifest) -notmatch 'zz-decoy-skill') { throw ".plan-and-track-manifest content changed" }
          if (-not (Test-Path -LiteralPath (Join-Path $H '.claude\skills\.plan-and-track-pruned'))) { throw "uninstall deleted .plan-and-track-pruned" }
          .\install-office-skills.ps1 uninstall   # rerun: must exit 0
          if ($LASTEXITCODE -ne 0) { throw "install-office-skills.ps1 (rerun uninstall) failed with exit code $LASTEXITCODE" }
      - name: Stale prune quarantines removed repo copies, never non-repo content
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home"
          $skills = "$env:USERPROFILE\.claude\skills"
          $manifest = "$skills\.plan-and-track-manifest"
          if (-not (Test-Path -LiteralPath $manifest)) { throw "manifest missing after install" }
          # 1. Repo-owned skill whose source was since removed -> must be pruned.
          New-Item -ItemType Directory -Force -Path "$skills\zz-stale-skill" | Out-Null
          Set-Content -Path "$skills\zz-stale-skill\SKILL.md" -Value "stale"
          Add-Content -Path $manifest -Value "zz-stale-skill"
          # 2. User-added skill: NOT in the manifest -> must survive.
          New-Item -ItemType Directory -Force -Path "$skills\zz-user-skill" | Out-Null
          Set-Content -Path "$skills\zz-user-skill\SKILL.md" -Value "keep"
          # 3. Stub office skill: NOT in the manifest -> must survive.
          New-Item -ItemType Directory -Force -Path "$skills\docx" | Out-Null
          Set-Content -Path "$skills\docx\SKILL.md" -Value "office"
          # 4. Junction at a manifest-recorded name pointing OUTSIDE the tree: prune
          #    must remove the link but never follow into the target.
          $ext = "$env:RUNNER_TEMP\external-precious"
          New-Item -ItemType Directory -Force -Path $ext | Out-Null
          Set-Content -Path "$ext\data.txt" -Value "precious"
          New-Item -ItemType Junction -Path "$skills\zz-linked-skill" -Target $ext | Out-Null
          Add-Content -Path $manifest -Value "zz-linked-skill"
          $out = (.\install.ps1 claude 6>&1 | Out-String); Write-Host $out
          $attic = "$skills\.plan-and-track-pruned"
          if (Test-Path -LiteralPath "$skills\zz-stale-skill") { throw "stale skill still present" }
          if (-not (Test-Path -LiteralPath "$attic\zz-stale-skill\SKILL.md")) { throw "stale skill not quarantined" }
          if (-not (Test-Path -LiteralPath "$skills\zz-user-skill\SKILL.md")) { throw "user skill was pruned" }
          if (-not (Test-Path -LiteralPath "$skills\docx\SKILL.md")) { throw "office skill was pruned" }
          if (Test-Path -LiteralPath "$skills\zz-linked-skill") { throw "stale junction not pruned" }
          if (-not (Test-Path -LiteralPath "$ext\data.txt")) { throw "junction target destroyed" }
          if ((Get-Content -Raw "$ext\data.txt").Trim() -ne "precious") { throw "junction target altered" }
          $out2 = (.\install.ps1 claude 6>&1 | Out-String); Write-Host $out2
          if ($out2 -match 'repo source removed') { throw "no-change rerun pruned something" }
          $a = (Get-FileHash "skills\plan-and-track\SKILL.md").Hash
          $b = (Get-FileHash "$skills\plan-and-track\SKILL.md").Hash
          if ($a -ne $b) { throw "real skill not byte-identical after prune" }
          Write-Host "OK: stale copy quarantined; user/office/junction-target survived; rerun pruned nothing"

      - name: Reparse-point attic is refused, external content survives
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-guard"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          .\install.ps1 claude 6>&1 | Out-Null
          $skills = "$env:USERPROFILE\.claude\skills"
          $manifest = "$skills\.plan-and-track-manifest"
          New-Item -ItemType Directory -Force -Path "$skills\zz-stale-skill" | Out-Null
          Set-Content -Path "$skills\zz-stale-skill\SKILL.md" -Value "stale"
          Add-Content -Path $manifest -Value "zz-stale-skill"
          # Attic is a junction to an external dir with an identically-named entry:
          # the guard must refuse, never Remove-Item -Recurse/Move-Item through it.
          # Survival of the external entry is itself the proof the guard fired.
          $ext = "$env:RUNNER_TEMP\ext-attic"
          New-Item -ItemType Directory -Force -Path "$ext\zz-stale-skill" | Out-Null
          Set-Content -Path "$ext\zz-stale-skill\keep" -Value "canary"
          New-Item -ItemType Junction -Path "$skills\.plan-and-track-pruned" -Target $ext | Out-Null
          .\install.ps1 claude 6>&1 | Out-String | Write-Host
          if (-not (Test-Path -LiteralPath "$ext\zz-stale-skill\keep")) { throw "external attic content deleted" }
          if (-not (Test-Path -LiteralPath "$skills\zz-stale-skill")) { throw "stale skill moved despite bad attic" }
          Write-Host "OK: reparse-point attic refused; external content untouched"
