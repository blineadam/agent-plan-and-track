      - name: Probe-agent frontmatter escape/quote round-trip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home"
          $H = $env:USERPROFILE
          # Probe files are written BOM-less, the same reason install.ps1
          # defines $Utf8NoBom: Windows PowerShell 5.1's -Encoding utf8 always
          # emits a BOM, and while install.ps1 reads through ReadAllLines and
          # never sees it, the Node comparator below compares its fence lines
          # with `line === '---'` and would read `﻿---` instead.
          $Utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $repo = (Get-Location).Path
          function Write-Probe($relPath, $text) {
            [System.IO.File]::WriteAllText((Join-Path $repo $relPath), $text, $Utf8NoBom)
          }
          # Two throwaway agents/*.md sources exercising the two frontmatter
          # defects Get-AgentFrontmatterField's decode covers: a single-quoted
          # description with a doubled '' escape, and a double-quoted one with
          # a \" escape. Removed at the end of this step; never committed.
          $probeSingle = @'
          ---
          name: zz-probe-single
          description: 'Use when: the value has an apostrophe, like don''t skip this step.'
          model: sonnet
          effort: high
          tools: Read, Grep, Glob
          ---

          Probe agent for CI only; removed at the end of this step.
          '@
          $probeEscape = @'
          ---
          name: zz-probe-escape
          description: "Use when: the value says \"hello\" and has a backslash before an escaped quote \\\" like that."
          model: sonnet
          effort: high
          tools: Read, Grep, Glob
          ---

          Probe agent for CI only; removed at the end of this step.
          '@
          Write-Probe 'agents\zz-probe-single.md' $probeSingle
          Write-Probe 'agents\zz-probe-escape.md' $probeEscape
          .\install.ps1 claude | Out-Null
          .\install.ps1 codex | Out-Null
          .\install.ps1 copilot | Out-Null
          # The decoded description must round-trip identically into all three
          # rendered formats (Claude copy, Codex TOML, Copilot .agent.md).
          node skills\skill-activation\scripts\run-activation-cases.js --precheck-agents agents "$H" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "probe-agent description did not round-trip through --precheck-agents" }
          # The Copilot render's tools value must be a YAML flow array, not a
          # bare or leaked-quote string.
          $probeContent = Get-Content -Raw "$H\.copilot\agents\zz-probe-single.agent.md"
          if ($probeContent -notmatch [regex]::Escape('tools: ["read", "search"]')) { throw "zz-probe-single.agent.md missing expected YAML flow array tools" }
          Remove-Item -LiteralPath 'agents\zz-probe-single.md' -Force
          Remove-Item -LiteralPath 'agents\zz-probe-escape.md' -Force
          # New defect: a value whose backslash escapes something the
          # installers cannot render (a tab) is legal YAML, so it would abort
          # the installers even though it passes frontmatter_invalid_yaml;
          # --precheck-agents must reject it before it ever reaches disk.
          $probeUninstallable = @'
          ---
          name: zz-probe-uninstallable
          description: "Use when: testing an uninstallable escape \t here."
          model: sonnet
          effort: high
          tools: Read, Grep, Glob
          ---

          Probe agent for CI only; removed at the end of this step.
          '@
          Write-Probe 'agents\zz-probe-uninstallable.md' $probeUninstallable
          # No installed-home argument on purpose, mirroring the unix job. This
          # probe is never installed, so passing one would make all three
          # description-match flags false and the run would exit nonzero
          # whatever the new check did, which is a vacuous test. Source-only,
          # then attribute the rejection to the flag by name.
          $probeOut = "$env:RUNNER_TEMP\uninstallable-probe.json"
          node skills\skill-activation\scripts\run-activation-cases.js --precheck-agents agents > $probeOut 2>&1
          if ($LASTEXITCODE -eq 0) { throw "--precheck-agents accepted an uninstallable \t escape" }
          if ((Get-Content -Raw $probeOut) -notmatch [regex]::Escape('"frontmatter_uninstallable_escape": true')) {
            throw "rejection was not attributed to frontmatter_uninstallable_escape"
          }
          Remove-Item -LiteralPath 'agents\zz-probe-uninstallable.md' -Force
          # Third defect: a value whose two ends are different quotes must come
          # back byte-verbatim rather than have each end stripped on its own.
          # Asserted against the render directly, not through
          # --precheck-agents, which flags such a value as invalid frontmatter
          # by design, and after the probes above are removed so it cannot
          # contaminate their round-trip check.
          $q = "'"
          $mismatchLines = @('---', 'name: zz-probe-mismatch', "description: `"Use when foo$q", 'model: sonnet', 'effort: high', 'tools: Read, Grep, Glob', '---', '', 'Probe agent for CI only.')
          Write-Probe 'agents\zz-probe-mismatch.md' (($mismatchLines -join "`n") + "`n")
          .\install.ps1 codex | Out-Null
          $mismatchToml = Get-Content -Raw "$H\.codex\agents\zz-probe-mismatch.toml"
          $expectedMismatch = 'description = "\"Use when foo' + $q + '"'
          if ($mismatchToml -notmatch [regex]::Escape($expectedMismatch)) {
            throw "mismatched-delimiter value did not survive verbatim into the Codex render"
          }
          Remove-Item -LiteralPath 'agents\zz-probe-mismatch.md' -Force
          # Negative control, mirroring the unix job. The loud abort is the
          # load-bearing half of the decode design, since a user running the
          # installer locally has no CI in the loop to catch a silently
          # corrupted render. Checked per field and per renderer; `claude` is
          # not covered because it copies agents verbatim.
          function Test-AbortOnBadEscape($field, $target) {
            if ($field -eq 'description') {
              $d = '"Use when testing an unhandled escape \qhere"'; $t = 'Read, Grep, Glob'
            } else {
              $d = 'Use when testing an unhandled escape in the tools field'; $t = '"Read, Grep\qGlob"'
            }
            $lines = @('---', 'name: zz-probe-abort', "description: $d", 'model: sonnet', 'effort: high', "tools: $t", '---', '', 'Probe agent for CI only.')
            Write-Probe 'agents\zz-probe-abort.md' (($lines -join "`n") + "`n")
            $aborted = $false
            try { & .\install.ps1 $target | Out-Null } catch {
              # Assert the reason, matching the unix job's stderr grep. Catching
              # any terminating error would pass on an unrelated failure and
              # make this control vacuous.
              if ($_.Exception.Message -notmatch 'unhandled escape') { throw "aborted for the wrong reason: $_" }
              $aborted = $true
            }
            if (-not $aborted) { throw "unhandled escape in $field did not abort .\install.ps1 $target" }
            Remove-Item -LiteralPath 'agents\zz-probe-abort.md' -Force
          }
          foreach ($f in @('description', 'tools')) {
            foreach ($t in @('codex', 'copilot')) { Test-AbortOnBadEscape $f $t }
          }
      - name: Office skills installer (stubbed fetch, no network)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stubBin = Join-Path $env:RUNNER_TEMP 'office-stub-bin'
          New-Item -ItemType Directory -Force -Path $stubBin | Out-Null
          # Fakes `npx skills add ... --agent <id> -g ...`'s output shape without
          # hitting the network, so this test exercises install-office-skills.ps1's
          # own detection/dispatch logic deterministically. The actual routing
          # logic lives in a PowerShell child script (easier to get right than
          # cmd.exe batch argument parsing); npx.cmd is just a launcher, since
          # only .cmd/.exe are resolved via PATH by default. Reads --agent from
          # its own args and routes to the same directories the real skills CLI
          # uses: claude-code -> %USERPROFILE%\.claude\skills, codex/github-copilot
          # -> the shared %USERPROFILE%\.agents\skills. Requires -g so a future
          # regression that drops the global flag from the real script fails this
          # test instead of passing.
          @'
          @echo off
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0npx-stub.ps1" %*
          '@ | Set-Content -Path (Join-Path $stubBin 'npx.cmd') -Encoding ascii
          @'
          $argsStr = $args -join " "
          if ($argsStr -notmatch "(^| )-g( |$)") {
            Write-Error "stub: expected -g (global install) but it was not passed"
            exit 1
          }
          if ($argsStr -notmatch "--agent (\S+)") {
            Write-Error "stub: no --agent found in '$argsStr'"
            exit 1
          }
          $agent = $matches[1]
          if ($agent -eq "claude-code") {
            $dest = Join-Path $env:USERPROFILE ".claude\skills"
          } elseif ($agent -eq "codex" -or $agent -eq "github-copilot") {
            $dest = Join-Path $env:USERPROFILE ".agents\skills"
          } else {
            Write-Error "stub: unknown --agent '$agent'"
            exit 1
          }
          Add-Content -Path (Join-Path $env:USERPROFILE "agent-invocations.log") -Value $agent
          foreach ($s in @("docx", "pdf", "pptx", "xlsx")) {
            New-Item -ItemType Directory -Force -Path (Join-Path $dest $s) | Out-Null
            Set-Content -Path (Join-Path $dest "$s\SKILL.md") -Value "stub"
          }
          exit 0
          '@ | Set-Content -Path (Join-Path $stubBin 'npx-stub.ps1') -Encoding ascii
          '@echo off' | Set-Content -Path (Join-Path $stubBin 'claude.cmd') -Encoding ascii
          '@echo off' | Set-Content -Path (Join-Path $stubBin 'codex.cmd') -Encoding ascii
          $env:PATH = "$stubBin;$env:PATH"
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-office"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.copilot" | Out-Null
          .\install-office-skills.ps1
          if ($LASTEXITCODE -ne 0) { throw "install-office-skills.ps1 failed with exit code $LASTEXITCODE" }
          .\install-office-skills.ps1   # rerun: must not fail
          if ($LASTEXITCODE -ne 0) { throw "install-office-skills.ps1 (rerun) failed with exit code $LASTEXITCODE" }
          $baseDir = $env:USERPROFILE
          foreach ($harness in @('.claude', '.agents')) {
            foreach ($s in @('docx', 'pdf', 'pptx', 'xlsx')) {
              $p = "$baseDir\$harness\skills\$s\SKILL.md"
              if (-not (Test-Path -LiteralPath $p)) { throw "missing $p" }
            }
          }
          # Codex and GitHub Copilot both write the shared .agents tree, so the
          # file-existence checks above pass even if one dispatch branch is
          # silently removed. Assert each agent was actually invoked.
          $invoked = Get-Content (Join-Path $baseDir "agent-invocations.log")
          foreach ($a in @('claude-code', 'codex', 'github-copilot')) {
            if ($invoked -notcontains $a) { throw "$a was never invoked" }
          }
      - name: Office skills uninstall (no network, no npx)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-office"
          $H = $env:USERPROFILE
          # .claude\skills and .agents\skills already carry the four office
          # skills from the install step above; .copilot\skills needs seeding
          # directly since the stub's github-copilot route never writes there.
          $copilotSkills = Join-Path $H '.copilot\skills'
          New-Item -ItemType Directory -Force -Path $copilotSkills | Out-Null
          foreach ($s in @('docx', 'pdf', 'pptx', 'xlsx')) {
            New-Item -ItemType Directory -Force -Path (Join-Path $copilotSkills $s) | Out-Null
            Set-Content -Path (Join-Path $copilotSkills "$s\SKILL.md") -Value "stub"
          }
          # A decoy repo-owned skill plus its manifest record and an empty
          # pruned-attic dir, seeded in the one destination install.ps1
          # actually manages: uninstall must never touch any of the three.
          $decoy = Join-Path $H '.claude\skills\zz-decoy-skill'
          New-Item -ItemType Directory -Force -Path $decoy | Out-Null
          Set-Content -Path (Join-Path $decoy 'SKILL.md') -Value "decoy"
          $manifest = Join-Path $H '.claude\skills\.plan-and-track-manifest'
          Add-Content -Path $manifest -Value "zz-decoy-skill"
          New-Item -ItemType Directory -Force -Path (Join-Path $H '.claude\skills\.plan-and-track-pruned') | Out-Null
          # Establish presence before asserting absence. Two of the three
          # destinations are seeded by the install step above rather than
          # here, so without this the post-uninstall test would pass against
          # a skill that was never there and check nothing.
          foreach ($dest in @("$H\.claude\skills", "$H\.agents\skills", "$H\.copilot\skills")) {
            foreach ($s in @('docx', 'pdf', 'pptx', 'xlsx')) {
              if (-not (Test-Path -LiteralPath (Join-Path $dest $s))) { throw "$dest\$s absent before uninstall; the absence check below would be vacuous" }
            }
          }
          # PATH stripped to the Windows system directory only, no npx
          # anywhere on it: proves uninstall needs neither network nor the
          # third-party skills CLI.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          .\install-office-skills.ps1 uninstall
          if ($LASTEXITCODE -ne 0) { throw "install-office-skills.ps1 uninstall failed with exit code $LASTEXITCODE" }
          foreach ($dest in @("$H\.claude\skills", "$H\.agents\skills", "$H\.copilot\skills")) {
            foreach ($s in @('docx', 'pdf', 'pptx', 'xlsx')) {
              if (Test-Path -LiteralPath (Join-Path $dest $s)) { throw "$dest\$s survived uninstall" }
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $decoy 'SKILL.md'))) { throw "uninstall deleted the decoy skill it must never touch" }
          if (-not (Test-Path -LiteralPath $manifest)) { throw "uninstall deleted .plan-and-track-manifest" }
          if ((Get-Content -Raw $manifest) -notmatch 'zz-decoy-skill') { throw ".plan-and-track-manifest content changed" }
          if (-not (Test-Path -LiteralPath (Join-Path $H '.claude\skills\.plan-and-track-pruned'))) { throw "uninstall deleted .plan-and-track-pruned" }
          .\install-office-skills.ps1 uninstall   # rerun: must exit 0
          if ($LASTEXITCODE -ne 0) { throw "install-office-skills.ps1 (rerun uninstall) failed with exit code $LASTEXITCODE" }
      - name: MCP servers installer (stubbed CLIs, no network)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stubBin = Join-Path $env:RUNNER_TEMP 'mcp-stub-bin'
          New-Item -ItemType Directory -Force -Path $stubBin | Out-Null
          $env:MCP_LOG = Join-Path $env:RUNNER_TEMP 'mcp-invocations.log'
          $env:MCP_STATE_DIR = Join-Path $env:RUNNER_TEMP 'mcp-state'
          Remove-Item -LiteralPath $env:MCP_LOG -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:MCP_STATE_DIR -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:MCP_STATE_DIR | Out-Null
          # Fakes `<cli> mcp get/add/remove chrome-devtools` without hitting the
          # network or npx, so this test exercises install-mcp-servers.ps1's own
          # detection/presence/dispatch logic deterministically. Each stub CLI is
          # a .cmd launcher (only .cmd/.exe are resolved via PATH by default)
          # that hands off to its own PowerShell logic, same shape as the office
          # skills npx.cmd/npx-stub.ps1 pair above. `mcp get` reports
          # present/absent from a small per-harness state file; `mcp add`/`mcp
          # remove` write/clear that file. Every invocation is also logged, so a
          # silently-dropped dispatch branch fails the assertions below on the
          # log, not just on state.
          @'
          @echo off
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0mcp-stub-claude.ps1" %*
          '@ | Set-Content -Path (Join-Path $stubBin 'claude.cmd') -Encoding ascii
          @'
          Add-Content -Path $env:MCP_LOG -Value ("claude " + ($args -join " ") + " [cwd=" + (Get-Location).Path + "]")
          $sub = $args[0] + " " + $args[1]
          switch ($sub) {
            "mcp get"    { if (Test-Path -LiteralPath (Join-Path $env:MCP_STATE_DIR "claude")) { exit 0 } else { exit 1 } }
            "mcp add"    { New-Item -ItemType File -Force -Path (Join-Path $env:MCP_STATE_DIR "claude") | Out-Null; exit 0 }
            "mcp remove" { Remove-Item -LiteralPath (Join-Path $env:MCP_STATE_DIR "claude") -Force -ErrorAction SilentlyContinue; exit 0 }
            default      { exit 1 }
          }
          '@ | Set-Content -Path (Join-Path $stubBin 'mcp-stub-claude.ps1') -Encoding ascii
          @'
          @echo off
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0mcp-stub-codex.ps1" %*
          '@ | Set-Content -Path (Join-Path $stubBin 'codex.cmd') -Encoding ascii
          @'
          Add-Content -Path $env:MCP_LOG -Value ("codex " + ($args -join " ") + " [cwd=" + (Get-Location).Path + "]")
          $sub = $args[0] + " " + $args[1]
          switch ($sub) {
            "mcp get"    { if (Test-Path -LiteralPath (Join-Path $env:MCP_STATE_DIR "codex")) { exit 0 } else { exit 1 } }
            "mcp add"    { New-Item -ItemType File -Force -Path (Join-Path $env:MCP_STATE_DIR "codex") | Out-Null; exit 0 }
            "mcp remove" { Remove-Item -LiteralPath (Join-Path $env:MCP_STATE_DIR "codex") -Force -ErrorAction SilentlyContinue; exit 0 }
            default      { exit 1 }
          }
          '@ | Set-Content -Path (Join-Path $stubBin 'mcp-stub-codex.ps1') -Encoding ascii
          @'
          @echo off
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0mcp-stub-copilot.ps1" %*
          '@ | Set-Content -Path (Join-Path $stubBin 'copilot.cmd') -Encoding ascii
          @'
          Add-Content -Path $env:MCP_LOG -Value ("copilot " + ($args -join " ") + " [cwd=" + (Get-Location).Path + "]")
          $sub = $args[0] + " " + $args[1]
          switch ($sub) {
            "mcp get"    { if (Test-Path -LiteralPath (Join-Path $env:MCP_STATE_DIR "copilot")) { exit 0 } else { exit 1 } }
            "mcp add"    { New-Item -ItemType File -Force -Path (Join-Path $env:MCP_STATE_DIR "copilot") | Out-Null; exit 0 }
            "mcp remove" { Remove-Item -LiteralPath (Join-Path $env:MCP_STATE_DIR "copilot") -Force -ErrorAction SilentlyContinue; exit 0 }
            default      { exit 1 }
          }
          '@ | Set-Content -Path (Join-Path $stubBin 'mcp-stub-copilot.ps1') -Encoding ascii
          $env:PATH = "$stubBin;$env:PATH"
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-mcp"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          function Expect-Line($label, $message) { return ("  {0,-11} -- {1}" -f $label, $message) }
          $repoRoot = (Get-Location).Path
          # 6>&1 is load-bearing: the script reports through Write-Host, which
          # writes to the information stream, so a bare pipe captures nothing
          # and every output assertion below would pass vacuously on an empty
          # string. It does not; it throws, which is how this was caught.

          $out1 = (.\install-mcp-servers.ps1 6>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "install-mcp-servers.ps1 failed with exit code $LASTEXITCODE" }
          Write-Host $out1
          foreach ($label in @('Claude Code', 'Codex', 'Copilot')) {
            if ($out1 -notmatch [regex]::Escape((Expect-Line $label 'added'))) { throw "$label was not reported as added on first run" }
          }
          foreach ($h in @('claude', 'codex', 'copilot')) {
            $addLines = Get-Content $env:MCP_LOG | Where-Object { $_ -match "^$h mcp add " }
            if (@($addLines).Count -ne 1) { throw "$h mcp add was not invoked exactly once on first run" }
          }
          # Codex on Windows must be registered with the upstream README's
          # Windows 11 form: npx launched through cmd, with SystemRoot and
          # PROGRAMFILES in the server's environment. The plain Unix form would
          # store a server Codex cannot start on Windows.
          # The two env patterns require a non-empty value, so an unset
          # variable silently producing "SystemRoot=" cannot pass.
          $codexAdd = @(Get-Content $env:MCP_LOG | Where-Object { $_ -match '^codex mcp add ' })[0]
          foreach ($pattern in @([regex]::Escape('cmd /c npx'), 'SystemRoot=\S', 'PROGRAMFILES=\S')) {
            if ($codexAdd -notmatch $pattern) { throw "codex mcp add does not match '$pattern': $codexAdd" }
          }
          # A script run in the caller's runspace must not leave it relocated:
          # the second invocation below resolves .\install-mcp-servers.ps1
          # relative to wherever the first one left the runspace.
          if ((Get-Location).Path -ne $repoRoot) { throw "install-mcp-servers.ps1 left the caller in $((Get-Location).Path), not $repoRoot" }

          $out2 = (.\install-mcp-servers.ps1 6>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "install-mcp-servers.ps1 (rerun) failed with exit code $LASTEXITCODE" }
          Write-Host $out2
          foreach ($label in @('Claude Code', 'Codex', 'Copilot')) {
            if ($out2 -notmatch [regex]::Escape((Expect-Line $label 'already configured, skipped'))) { throw "$label was not reported as already configured on rerun" }
          }
          $addLinesAll = Get-Content $env:MCP_LOG | Where-Object { $_ -match ' mcp add ' }
          if (@($addLinesAll).Count -ne 3) { throw "rerun issued a second mcp add" }
      - name: MCP servers uninstall (stubbed CLIs, no network)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MCP_LOG = Join-Path $env:RUNNER_TEMP 'mcp-invocations.log'
          $env:MCP_STATE_DIR = Join-Path $env:RUNNER_TEMP 'mcp-state'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-mcp"
          $env:PATH = "$env:RUNNER_TEMP\mcp-stub-bin;$env:PATH"
          function Expect-Line($label, $message) { return ("  {0,-11} -- {1}" -f $label, $message) }

          $out3 = (.\install-mcp-servers.ps1 uninstall 6>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "install-mcp-servers.ps1 uninstall failed with exit code $LASTEXITCODE" }
          Write-Host $out3
          foreach ($label in @('Claude Code', 'Codex', 'Copilot')) {
            if ($out3 -notmatch [regex]::Escape((Expect-Line $label 'removed'))) { throw "$label was not reported as removed" }
          }
          foreach ($h in @('claude', 'codex', 'copilot')) {
            $removeLines = Get-Content $env:MCP_LOG | Where-Object { $_ -match "^$h mcp remove " }
            if (@($removeLines).Count -ne 1) { throw "$h mcp remove was not invoked exactly once" }
            if (Test-Path -LiteralPath (Join-Path $env:MCP_STATE_DIR $h)) { throw "$env:MCP_STATE_DIR\$h survived uninstall" }
          }

          $out4 = (.\install-mcp-servers.ps1 uninstall 6>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "rerun of uninstall exited $LASTEXITCODE" }
          Write-Host $out4
          foreach ($label in @('Claude Code', 'Codex', 'Copilot')) {
            if ($out4 -notmatch [regex]::Escape((Expect-Line $label 'not configured, skipped'))) { throw "$label was not reported as not configured on the uninstall rerun" }
          }

          # Every harness CLI call, across both this step and the installer step
          # above (they share one log), must have run from an isolated scratch
          # directory that no longer exists. Claude Code and Copilot resolve
          # project-scoped MCP config from the working directory and expose no
          # scope flag on `mcp get`, so a cwd-sensitive script run from a repo
          # whose .mcp.json declares this server would report it already
          # configured and skip the user-scope install it exists to do.
          # %USERPROFILE% is rejected too, since it can carry a .mcp.json.
          $repoRoot = (Get-Location).Path
          $cwds = Get-Content $env:MCP_LOG | ForEach-Object { if ($_ -match '\[cwd=(.*)\]$') { $Matches[1] } } | Sort-Object -Unique
          if (@($cwds).Count -eq 0) { throw "no working directories were logged; the check below would be vacuous" }
          foreach ($d in $cwds) {
            if ($d -eq $repoRoot -or $d -eq $env:USERPROFILE) { throw "a harness CLI ran from $d, not an isolated scratch directory" }
            if (Test-Path -LiteralPath $d) { throw "scratch directory $d survived the run" }
          }
      - name: MCP servers installer refuses to install without npx
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MCP_LOG = Join-Path $env:RUNNER_TEMP 'mcp-nonpx.log'
          $env:MCP_STATE_DIR = Join-Path $env:RUNNER_TEMP 'mcp-state-nonpx'
          Remove-Item -LiteralPath $env:MCP_LOG -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:MCP_STATE_DIR -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:MCP_STATE_DIR | Out-Null
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-mcp-nonpx"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          # Harness stubs present, no Node toolchain. System32 and the Windows
          # PowerShell directory stay on PATH because the stub .cmd launchers
          # shell out to powershell; neither carries npx.
          $powershellExe = (Get-Command powershell).Source
          $env:PATH = "$env:RUNNER_TEMP\mcp-stub-bin;$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          if (Get-Command npx -ErrorAction SilentlyContinue) { throw "npx is still on PATH; the assertions below would be vacuous" }
          # This step calls the script as a child process, unlike the two above.
          # The gate reports through [Console]::Error, which writes straight to
          # the process stderr handle and so is invisible to PowerShell's own
          # stream redirection; only a real child process has a stderr pipe to
          # capture. It is also the entry point the docs actually publish.
          #
          # ErrorActionPreference drops to Continue around both child calls:
          # Windows PowerShell 5.1 raises a terminating NativeCommandError when
          # a native command writes to stderr under Stop, so the gate firing
          # correctly would abort this step before any assertion ran.
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $out = (& $powershellExe -NoProfile -ExecutionPolicy Bypass -File .\install-mcp-servers.ps1 2>&1 | Out-String)
            $installCode = $LASTEXITCODE
            # Uninstall never runs npx, so it must stay usable without it.
            $out2 = (& $powershellExe -NoProfile -ExecutionPolicy Bypass -File .\install-mcp-servers.ps1 uninstall 2>&1 | Out-String)
            $uninstallCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $prevEap
          }
          if ($installCode -ne 1) { throw "install exited $installCode with npx absent, expected 1`n$out" }
          if ($out -notmatch 'npx is required') { throw "no npx diagnostic in: $out" }
          foreach ($h in @('claude', 'codex', 'copilot')) {
            if (Test-Path -LiteralPath (Join-Path $env:MCP_STATE_DIR $h)) { throw "$h was configured even though the npx gate should have stopped the run" }
          }
          if ($uninstallCode -ne 0) { throw "uninstall exited $uninstallCode with npx absent`n$out2" }
          if ($out2 -notmatch 'not configured, skipped') { throw "uninstall did not run with npx absent: $out2" }
      - name: Stale prune quarantines removed repo copies, never non-repo content
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home"
          $skills = "$env:USERPROFILE\.claude\skills"
          $manifest = "$skills\.plan-and-track-manifest"
          if (-not (Test-Path -LiteralPath $manifest)) { throw "manifest missing after install" }
          # 1. Repo-owned skill whose source was since removed -> must be pruned.
          New-Item -ItemType Directory -Force -Path "$skills\zz-stale-skill" | Out-Null
          Set-Content -Path "$skills\zz-stale-skill\SKILL.md" -Value "stale"
          Add-Content -Path $manifest -Value "zz-stale-skill"
          # 2. User-added skill: NOT in the manifest -> must survive.
          New-Item -ItemType Directory -Force -Path "$skills\zz-user-skill" | Out-Null
          Set-Content -Path "$skills\zz-user-skill\SKILL.md" -Value "keep"
          # 3. Stub office skill: NOT in the manifest -> must survive.
          New-Item -ItemType Directory -Force -Path "$skills\docx" | Out-Null
          Set-Content -Path "$skills\docx\SKILL.md" -Value "office"
          # 4. Junction at a manifest-recorded name pointing OUTSIDE the tree: prune
          #    must remove the link but never follow into the target.
          $ext = "$env:RUNNER_TEMP\external-precious"
          New-Item -ItemType Directory -Force -Path $ext | Out-Null
          Set-Content -Path "$ext\data.txt" -Value "precious"
          New-Item -ItemType Junction -Path "$skills\zz-linked-skill" -Target $ext | Out-Null
          Add-Content -Path $manifest -Value "zz-linked-skill"
          $out = (.\install.ps1 claude 6>&1 | Out-String); Write-Host $out
          $attic = "$skills\.plan-and-track-pruned"
          if (Test-Path -LiteralPath "$skills\zz-stale-skill") { throw "stale skill still present" }
          if (-not (Test-Path -LiteralPath "$attic\zz-stale-skill\SKILL.md")) { throw "stale skill not quarantined" }
          if (-not (Test-Path -LiteralPath "$skills\zz-user-skill\SKILL.md")) { throw "user skill was pruned" }
          if (-not (Test-Path -LiteralPath "$skills\docx\SKILL.md")) { throw "office skill was pruned" }
          if (Test-Path -LiteralPath "$skills\zz-linked-skill") { throw "stale junction not pruned" }
          if (-not (Test-Path -LiteralPath "$ext\data.txt")) { throw "junction target destroyed" }
          if ((Get-Content -Raw "$ext\data.txt").Trim() -ne "precious") { throw "junction target altered" }
          $out2 = (.\install.ps1 claude 6>&1 | Out-String); Write-Host $out2
          if ($out2 -match 'repo source removed') { throw "no-change rerun pruned something" }
          $a = (Get-FileHash "skills\plan-and-track\SKILL.md").Hash
          $b = (Get-FileHash "$skills\plan-and-track\SKILL.md").Hash
          if ($a -ne $b) { throw "real skill not byte-identical after prune" }
          Write-Host "OK: stale copy quarantined; user/office/junction-target survived; rerun pruned nothing"

      - name: Reparse-point attic is refused, external content survives
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-guard"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          .\install.ps1 claude 6>&1 | Out-Null
          $skills = "$env:USERPROFILE\.claude\skills"
          $manifest = "$skills\.plan-and-track-manifest"
          New-Item -ItemType Directory -Force -Path "$skills\zz-stale-skill" | Out-Null
          Set-Content -Path "$skills\zz-stale-skill\SKILL.md" -Value "stale"
          Add-Content -Path $manifest -Value "zz-stale-skill"
          # Attic is a junction to an external dir with an identically-named entry:
          # the guard must refuse, never Remove-Item -Recurse/Move-Item through it.
          # Survival of the external entry is itself the proof the guard fired.
          $ext = "$env:RUNNER_TEMP\ext-attic"
          New-Item -ItemType Directory -Force -Path "$ext\zz-stale-skill" | Out-Null
          Set-Content -Path "$ext\zz-stale-skill\keep" -Value "canary"
          New-Item -ItemType Junction -Path "$skills\.plan-and-track-pruned" -Target $ext | Out-Null
          .\install.ps1 claude 6>&1 | Out-String | Write-Host
          if (-not (Test-Path -LiteralPath "$ext\zz-stale-skill\keep")) { throw "external attic content deleted" }
          if (-not (Test-Path -LiteralPath "$skills\zz-stale-skill")) { throw "stale skill moved despite bad attic" }
          Write-Host "OK: reparse-point attic refused; external content untouched"
