      - name: Probe-agent frontmatter escape/quote round-trip
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home"
          # Two throwaway agents/*.md sources exercising the two frontmatter
          # defects frontmatter_field's decode covers: a single-quoted
          # description with a doubled '' escape, and a double-quoted one with
          # a \" escape. Removed at the end of this step; never committed.
          cat > agents/zz-probe-single.md <<'PROBE'
          ---
          name: zz-probe-single
          description: 'Use when: the value has an apostrophe, like don''t skip this step.'
          model: sonnet
          effort: high
          tools: Read, Grep, Glob
          ---

          Probe agent for CI only; removed at the end of this step.
          PROBE
          cat > agents/zz-probe-escape.md <<'PROBE'
          ---
          name: zz-probe-escape
          description: "Use when: the value says \"hello\" and has a backslash before an escaped quote \\\" like that."
          model: sonnet
          effort: high
          tools: Read, Grep, Glob
          ---

          Probe agent for CI only; removed at the end of this step.
          PROBE
          ./install.sh claude >/dev/null
          ./install.sh codex >/dev/null
          ./install.sh copilot >/dev/null
          # The decoded description must round-trip identically into all three
          # rendered formats (Claude copy, Codex TOML, Copilot .agent.md).
          node skills/skill-activation/scripts/run-activation-cases.js --precheck-agents agents "$HOME" >/dev/null
          # The Copilot render's tools value must be a YAML flow array, not a
          # bare or leaked-quote string.
          grep -qF 'tools: ["read", "search"]' "$HOME/.copilot/agents/zz-probe-single.agent.md" \
            || { echo "FAIL: zz-probe-single.agent.md missing expected YAML flow array tools"; exit 1; }
          rm -f agents/zz-probe-single.md agents/zz-probe-escape.md
          # New defect: a value whose backslash escapes something the
          # installers cannot render (a tab) is legal YAML, so it would abort
          # the installers even though it passes frontmatter_invalid_yaml;
          # --precheck-agents must reject it before it ever reaches disk.
          cat > agents/zz-probe-uninstallable.md <<'PROBE'
          ---
          name: zz-probe-uninstallable
          description: "Use when: testing an uninstallable escape \t here."
          model: sonnet
          effort: high
          tools: Read, Grep, Glob
          ---

          Probe agent for CI only; removed at the end of this step.
          PROBE
          # No installed-home argument on purpose. This probe is never
          # installed, so passing one would make all three description-match
          # flags false and the run would exit nonzero whatever the new check
          # did, which is a vacuous test. Source-only, then attribute the
          # rejection to the flag by name rather than trusting the exit code.
          probe_out="$RUNNER_TEMP/uninstallable-probe.json"
          if node skills/skill-activation/scripts/run-activation-cases.js --precheck-agents agents > "$probe_out" 2>&1; then
            echo "FAIL: --precheck-agents accepted an uninstallable \\t escape"; exit 1
          fi
          grep -q '"frontmatter_uninstallable_escape": true' "$probe_out" \
            || { echo "FAIL: rejection was not attributed to frontmatter_uninstallable_escape"; cat "$probe_out"; exit 1; }
          rm -f agents/zz-probe-uninstallable.md
          # Third defect: a value whose two ends are different quotes must come
          # back byte-verbatim rather than have each end stripped on its own.
          # Asserted against the render directly, not through
          # --precheck-agents, which flags such a value as invalid frontmatter
          # by design, and after the probes above are removed so it cannot
          # contaminate their round-trip check.
          q="'"
          printf -- '---\nname: zz-probe-mismatch\ndescription: "Use when foo%s\nmodel: sonnet\neffort: high\ntools: Read, Grep, Glob\n---\n\nProbe agent for CI only.\n' \
            "$q" > agents/zz-probe-mismatch.md
          ./install.sh codex >/dev/null
          expected="$(printf 'description = "\\"Use when foo%s"' "$q")"
          grep -qF "$expected" "$HOME/.codex/agents/zz-probe-mismatch.toml" || {
            echo "FAIL: mismatched-delimiter value did not survive verbatim into the Codex render"
            cat "$HOME/.codex/agents/zz-probe-mismatch.toml"; exit 1; }
          rm -f agents/zz-probe-mismatch.md
          # Negative control. The loud abort is the load-bearing half of the
          # decode design, since a user running the installer locally has no CI
          # in the loop to catch a silently corrupted render. Checked per field
          # and per renderer, because only a call site can mask the abort: a
          # nested command substitution hides the inner exit status from set -e.
          # `claude` is not covered because it copies agents verbatim.
          probe_abort() {
            if [ "$1" = description ]; then
              d='"Use when testing an unhandled escape \qhere"'; t='Read, Grep, Glob'
            else
              d='Use when testing an unhandled escape in the tools field'; t='"Read, Grep\qGlob"'
            fi
            printf -- '---\nname: zz-probe-abort\ndescription: %s\nmodel: sonnet\neffort: high\ntools: %s\n---\n\nProbe agent for CI only.\n' \
              "$d" "$t" > agents/zz-probe-abort.md
            if ./install.sh "$2" >/dev/null 2>"$RUNNER_TEMP/abort-$1-$2.err"; then
              echo "FAIL: unhandled escape in $1 did not abort ./install.sh $2"; exit 1
            fi
            grep -q 'unhandled escape' "$RUNNER_TEMP/abort-$1-$2.err" \
              || { echo "FAIL: no unhandled-escape diagnostic for $1 on $2"; exit 1; }
            rm -f agents/zz-probe-abort.md
          }
          for f in description tools; do
            for t in codex copilot; do probe_abort "$f" "$t"; done
          done
      - name: Office skills installer (stubbed fetch, no network)
        run: |
          set -euo pipefail
          stub_bin="$RUNNER_TEMP/office-stub-bin"
          mkdir -p "$stub_bin"
          cat > "$stub_bin/npx" <<'STUB'
          #!/usr/bin/env bash
          # Fakes `npx skills add ... --agent <id> -g ...`'s output shape without
          # hitting the network, so this test exercises install-office-skills.sh's
          # own detection/dispatch logic deterministically. Reads --agent from its
          # own args and routes to the same directories the real skills CLI uses:
          # claude-code -> ~/.claude/skills, codex/github-copilot -> the shared
          # ~/.agents/skills. Requires -g so a future regression that drops the
          # global flag from the real script fails this test instead of passing.
          agent=""
          global=false
          while [ $# -gt 0 ]; do
            case "$1" in
              --agent) agent="$2"; shift 2 ;;
              -g) global=true; shift ;;
              *) shift ;;
            esac
          done
          $global || { echo "stub: expected -g (global install) but it was not passed" >&2; exit 1; }
          case "$agent" in
            claude-code) dest="$HOME/.claude/skills" ;;
            codex|github-copilot) dest="$HOME/.agents/skills" ;;
            *) echo "stub: unknown --agent $agent" >&2; exit 1 ;;
          esac
          echo "$agent" >> "$HOME/agent-invocations.log"
          for s in docx pdf pptx xlsx; do
            mkdir -p "$dest/$s"
            printf -- '---\nname: %s\ndescription: stub\n---\n# stub\n' "$s" > "$dest/$s/SKILL.md"
          done
          STUB
          chmod +x "$stub_bin/npx"
          printf '#!/usr/bin/env bash\n' > "$stub_bin/claude"; chmod +x "$stub_bin/claude"
          printf '#!/usr/bin/env bash\n' > "$stub_bin/codex"; chmod +x "$stub_bin/codex"
          export HOME="$RUNNER_TEMP/scratch-home-office"; mkdir -p "$HOME/.copilot"
          export PATH="$stub_bin:$PATH"
          ./install-office-skills.sh
          ./install-office-skills.sh   # rerun: must not fail
          for s in docx pdf pptx xlsx; do
            test -f "$HOME/.claude/skills/$s/SKILL.md" \
              || { echo "FAIL: missing $HOME/.claude/skills/$s/SKILL.md"; exit 1; }
            test -f "$HOME/.agents/skills/$s/SKILL.md" \
              || { echo "FAIL: missing $HOME/.agents/skills/$s/SKILL.md"; exit 1; }
          done
          # Codex and GitHub Copilot both write the shared .agents/skills tree, so
          # the file-existence checks above pass even if one of the two dispatch
          # branches is silently removed. Assert each agent was actually invoked.
          for a in claude-code codex github-copilot; do
            grep -qx "$a" "$HOME/agent-invocations.log" \
              || { echo "FAIL: $a was never invoked"; exit 1; }
          done
      - name: Office skills uninstall (no network, no npx)
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home-office"
          # .claude/skills and .agents/skills already carry the four office
          # skills from the install step above; .copilot/skills needs seeding
          # directly since the stub's github-copilot route never writes there.
          mkdir -p "$HOME/.copilot/skills"
          for s in docx pdf pptx xlsx; do
            mkdir -p "$HOME/.copilot/skills/$s"
            printf -- '---\nname: %s\ndescription: stub\n---\n# stub\n' "$s" > "$HOME/.copilot/skills/$s/SKILL.md"
          done
          # A decoy repo-owned skill plus its manifest record and an empty
          # pruned-attic dir, seeded in the one destination install.sh
          # actually manages: uninstall must never touch any of the three.
          decoy="$HOME/.claude/skills/zz-decoy-skill"
          mkdir -p "$decoy"
          printf -- '---\nname: zz-decoy-skill\ndescription: decoy\n---\n# decoy\n' > "$decoy/SKILL.md"
          manifest="$HOME/.claude/skills/.plan-and-track-manifest"
          echo "zz-decoy-skill" >> "$manifest"
          mkdir -p "$HOME/.claude/skills/.plan-and-track-pruned"
          # Establish presence before asserting absence. Two of the three
          # destinations are seeded by the install step above rather than
          # here, so without this the post-uninstall test would pass against
          # a skill that was never there and check nothing.
          for dest in "$HOME/.claude/skills" "$HOME/.agents/skills" "$HOME/.copilot/skills"; do
            for s in docx pdf pptx xlsx; do
              test -e "$dest/$s" \
                || { echo "FAIL: $dest/$s absent before uninstall; the absence check below would be vacuous"; exit 1; }
            done
          done
          # PATH stripped to bare coreutils, no npx anywhere on it: proves
          # uninstall needs neither network nor the third-party skills CLI.
          export PATH="/usr/bin:/bin"
          ./install-office-skills.sh uninstall
          for dest in "$HOME/.claude/skills" "$HOME/.agents/skills" "$HOME/.copilot/skills"; do
            for s in docx pdf pptx xlsx; do
              test ! -e "$dest/$s" \
                || { echo "FAIL: $dest/$s survived uninstall"; exit 1; }
            done
          done
          test -f "$decoy/SKILL.md" \
            || { echo "FAIL: uninstall deleted the decoy skill it must never touch"; exit 1; }
          test -f "$manifest" \
            || { echo "FAIL: uninstall deleted .plan-and-track-manifest"; exit 1; }
          grep -qx zz-decoy-skill "$manifest" \
            || { echo "FAIL: .plan-and-track-manifest content changed"; exit 1; }
          test -d "$HOME/.claude/skills/.plan-and-track-pruned" \
            || { echo "FAIL: uninstall deleted .plan-and-track-pruned"; exit 1; }
          ./install-office-skills.sh uninstall   # rerun: must exit 0
      - name: MCP servers installer (stubbed CLIs, no network)
        run: |
          set -euo pipefail
          stub_bin="$RUNNER_TEMP/mcp-stub-bin"
          mkdir -p "$stub_bin"
          export MCP_LOG="$RUNNER_TEMP/mcp-invocations.log"
          export MCP_STATE_DIR="$RUNNER_TEMP/mcp-state"
          rm -f "$MCP_LOG"
          rm -rf "$MCP_STATE_DIR"; mkdir -p "$MCP_STATE_DIR"
          # Fakes `<cli> mcp get/add/remove chrome-devtools` without hitting the
          # network or npx, so this test exercises install-mcp-servers.sh's own
          # detection/presence/dispatch logic deterministically. `mcp get`
          # reports present/absent from a small per-harness state file; `mcp add`
          # and `mcp remove` write/clear that file. Every invocation is also
          # logged, so a silently-dropped dispatch branch fails the assertions
          # below on the log, not just on state.
          cat > "$stub_bin/claude" <<'STUB'
          #!/usr/bin/env bash
          echo "claude $* [cwd=$PWD]" >> "$MCP_LOG"
          case "$1 $2" in
            "mcp get")    [ -f "$MCP_STATE_DIR/claude" ] && exit 0 || exit 1 ;;
            "mcp add")    touch "$MCP_STATE_DIR/claude"; exit 0 ;;
            "mcp remove") rm -f "$MCP_STATE_DIR/claude"; exit 0 ;;
          esac
          exit 1
          STUB
          chmod +x "$stub_bin/claude"
          cat > "$stub_bin/codex" <<'STUB'
          #!/usr/bin/env bash
          echo "codex $* [cwd=$PWD]" >> "$MCP_LOG"
          case "$1 $2" in
            "mcp get")    [ -f "$MCP_STATE_DIR/codex" ] && exit 0 || exit 1 ;;
            "mcp add")    touch "$MCP_STATE_DIR/codex"; exit 0 ;;
            "mcp remove") rm -f "$MCP_STATE_DIR/codex"; exit 0 ;;
          esac
          exit 1
          STUB
          chmod +x "$stub_bin/codex"
          cat > "$stub_bin/copilot" <<'STUB'
          #!/usr/bin/env bash
          echo "copilot $* [cwd=$PWD]" >> "$MCP_LOG"
          case "$1 $2" in
            "mcp get")    [ -f "$MCP_STATE_DIR/copilot" ] && exit 0 || exit 1 ;;
            "mcp add")    touch "$MCP_STATE_DIR/copilot"; exit 0 ;;
            "mcp remove") rm -f "$MCP_STATE_DIR/copilot"; exit 0 ;;
          esac
          exit 1
          STUB
          chmod +x "$stub_bin/copilot"
          export HOME="$RUNNER_TEMP/scratch-home-mcp"; mkdir -p "$HOME"
          export PATH="$stub_bin:$PATH"
          expect_line() { printf "  %-11s -- %s" "$1" "$2"; }

          out1="$(./install-mcp-servers.sh)"
          echo "$out1"
          for label in "Claude Code" "Codex" "Copilot"; do
            echo "$out1" | grep -qF "$(expect_line "$label" "added")" \
              || { echo "FAIL: $label was not reported as added on first run"; exit 1; }
          done
          for h in claude codex copilot; do
            [ "$(grep -c "^$h mcp add " "$MCP_LOG")" -eq 1 ] \
              || { echo "FAIL: $h mcp add was not invoked exactly once on first run"; cat "$MCP_LOG"; exit 1; }
          done

          out2="$(./install-mcp-servers.sh)"
          echo "$out2"
          for label in "Claude Code" "Codex" "Copilot"; do
            echo "$out2" | grep -qF "$(expect_line "$label" "already configured, skipped")" \
              || { echo "FAIL: $label was not reported as already configured on rerun"; exit 1; }
          done
          [ "$(grep -c ' mcp add ' "$MCP_LOG")" -eq 3 ] \
            || { echo "FAIL: rerun issued a second mcp add"; cat "$MCP_LOG"; exit 1; }
      - name: MCP servers uninstall (stubbed CLIs, no network)
        run: |
          set -euo pipefail
          export MCP_LOG="$RUNNER_TEMP/mcp-invocations.log"
          export MCP_STATE_DIR="$RUNNER_TEMP/mcp-state"
          export HOME="$RUNNER_TEMP/scratch-home-mcp"
          export PATH="$RUNNER_TEMP/mcp-stub-bin:$PATH"
          expect_line() { printf "  %-11s -- %s" "$1" "$2"; }

          out3="$(./install-mcp-servers.sh uninstall)"
          echo "$out3"
          for label in "Claude Code" "Codex" "Copilot"; do
            echo "$out3" | grep -qF "$(expect_line "$label" "removed")" \
              || { echo "FAIL: $label was not reported as removed"; exit 1; }
          done
          for h in claude codex copilot; do
            [ "$(grep -c "^$h mcp remove " "$MCP_LOG")" -eq 1 ] \
              || { echo "FAIL: $h mcp remove was not invoked exactly once"; cat "$MCP_LOG"; exit 1; }
            [ ! -e "$MCP_STATE_DIR/$h" ] \
              || { echo "FAIL: $MCP_STATE_DIR/$h survived uninstall"; exit 1; }
          done

          set +e
          out4="$(./install-mcp-servers.sh uninstall 2>&1)"
          code=$?
          set -e
          [ "$code" -eq 0 ] || { echo "FAIL: rerun of uninstall exited $code"; echo "$out4"; exit 1; }
          echo "$out4"
          for label in "Claude Code" "Codex" "Copilot"; do
            echo "$out4" | grep -qF "$(expect_line "$label" "not configured, skipped")" \
              || { echo "FAIL: $label was not reported as not configured on the uninstall rerun"; exit 1; }
          done

          # Every harness CLI call, across both this step and the installer step
          # above (they share one log), must have run from an isolated scratch
          # directory that no longer exists. Claude Code and Copilot resolve
          # project-scoped MCP config from the working directory and expose no
          # scope flag on `mcp get`, so a cwd-sensitive script run from a repo
          # whose .mcp.json declares this server would report it already
          # configured and skip the user-scope install it exists to do. $HOME is
          # rejected too, since it can carry a .mcp.json of its own.
          for d in $(sed -n 's/.*\[cwd=\(.*\)\]$/\1/p' "$MCP_LOG" | sort -u); do
            case "$d" in
              "$PWD"|"$HOME")
                echo "FAIL: a harness CLI ran from $d, not an isolated scratch directory"; exit 1 ;;
            esac
            [ ! -e "$d" ] \
              || { echo "FAIL: scratch directory $d survived the run"; exit 1; }
          done
      - name: MCP servers installer refuses to install without npx
        run: |
          set -euo pipefail
          export MCP_LOG="$RUNNER_TEMP/mcp-nonpx.log"
          export MCP_STATE_DIR="$RUNNER_TEMP/mcp-state-nonpx"
          rm -f "$MCP_LOG"; rm -rf "$MCP_STATE_DIR"; mkdir -p "$MCP_STATE_DIR"
          export HOME="$RUNNER_TEMP/scratch-home-mcp-nonpx"; mkdir -p "$HOME"
          # Harness stubs present, no Node toolchain: /usr/bin and /bin carry
          # coreutils and the bash the stubs need, but not npx.
          export PATH="$RUNNER_TEMP/mcp-stub-bin:/usr/bin:/bin"
          if command -v npx >/dev/null 2>&1; then
            echo "FAIL: npx is still on PATH; the assertions below would be vacuous"; exit 1
          fi
          set +e
          out="$(./install-mcp-servers.sh 2>&1)"; code=$?
          set -e
          [ "$code" -eq 1 ] \
            || { echo "FAIL: install exited $code with npx absent, expected 1"; echo "$out"; exit 1; }
          echo "$out" | grep -q 'npx is required' \
            || { echo "FAIL: no npx diagnostic in: $out"; exit 1; }
          for h in claude codex copilot; do
            [ ! -e "$MCP_STATE_DIR/$h" ] \
              || { echo "FAIL: $h was configured even though the npx gate should have stopped the run"; exit 1; }
          done
          # Uninstall never runs npx, so it must stay usable without it.
          out2="$(./install-mcp-servers.sh uninstall 2>&1)"
          echo "$out2" | grep -q 'not configured, skipped' \
            || { echo "FAIL: uninstall did not run with npx absent: $out2"; exit 1; }
      - name: Stale prune quarantines removed repo copies, never non-repo content
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home"
          skills="$HOME/.claude/skills"
          manifest="$skills/.plan-and-track-manifest"
          test -f "$manifest" || { echo "FAIL: manifest missing after install"; exit 1; }
          # 1. Repo-owned skill whose source was since removed: on disk AND recorded
          #    in the manifest, but absent from the current repo skill set -> prune.
          mkdir -p "$skills/zz-stale-skill"
          printf -- '---\nname: zz-stale-skill\ndescription: stale\n---\n' > "$skills/zz-stale-skill/SKILL.md"
          echo "zz-stale-skill" >> "$manifest"
          # 2. User-added skill: on disk, NOT in the manifest -> must survive.
          mkdir -p "$skills/zz-user-skill"; echo keep > "$skills/zz-user-skill/SKILL.md"
          # 3. Stub office skill: on disk, NOT in the manifest -> must survive.
          mkdir -p "$skills/docx"; echo office > "$skills/docx/SKILL.md"
          # 4. Symlink at a manifest-recorded (repo-owned) name pointing OUTSIDE the
          #    tree: prune must remove the link but never follow into the target.
          ext="$RUNNER_TEMP/external-precious"; mkdir -p "$ext"; echo precious > "$ext/data.txt"
          ln -s "$ext" "$skills/zz-linked-skill"
          echo "zz-linked-skill" >> "$manifest"
          out="$(./install.sh claude)"; echo "$out"
          attic="$skills/.plan-and-track-pruned"
          test ! -e "$skills/zz-stale-skill" || { echo "FAIL: stale skill still present"; exit 1; }
          test -f "$attic/zz-stale-skill/SKILL.md" || { echo "FAIL: stale skill not quarantined"; exit 1; }
          test -f "$skills/zz-user-skill/SKILL.md" || { echo "FAIL: user skill was pruned"; exit 1; }
          test -f "$skills/docx/SKILL.md" || { echo "FAIL: office skill was pruned"; exit 1; }
          test ! -e "$skills/zz-linked-skill" || { echo "FAIL: stale symlink not pruned"; exit 1; }
          { test -f "$ext/data.txt" && grep -q precious "$ext/data.txt"; } || { echo "FAIL: symlink target destroyed"; exit 1; }
          out2="$(./install.sh claude)"; echo "$out2"
          echo "$out2" | grep -q 'repo source removed' && { echo "FAIL: no-change rerun pruned something"; exit 1; } || true
          cmp -s "skills/plan-and-track/SKILL.md" "$skills/plan-and-track/SKILL.md" || { echo "FAIL: real skill not byte-identical after prune"; exit 1; }
          echo "OK: stale copy quarantined; user/office/symlink-target survived; rerun pruned nothing"

      - name: Symlinked attic or manifest is refused, external content survives
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/scratch-home-guard"
          mkdir -p "$HOME"
          ./install.sh claude >/dev/null
          skills="$HOME/.claude/skills"
          manifest="$skills/.plan-and-track-manifest"
          # A stale name so the prune has work to do.
          mkdir -p "$skills/zz-stale-skill"; echo stale > "$skills/zz-stale-skill/SKILL.md"
          echo "zz-stale-skill" >> "$manifest"
          # A) Attic is a symlink to an external dir holding an identically-named
          #    entry: the guard must refuse, never rm -rf/mv into the target.
          ext="$RUNNER_TEMP/ext-attic"; mkdir -p "$ext/zz-stale-skill"; echo canary > "$ext/zz-stale-skill/keep"
          ln -s "$ext" "$skills/.plan-and-track-pruned"
          ./install.sh claude >/dev/null 2>"$RUNNER_TEMP/guardA.err" || true
          test -f "$ext/zz-stale-skill/keep" || { echo "FAIL: external attic content deleted"; exit 1; }
          test -d "$skills/zz-stale-skill" || { echo "FAIL: stale skill moved despite bad attic"; exit 1; }
          grep -q 'is a symlink' "$RUNNER_TEMP/guardA.err" || { echo "FAIL: no attic-symlink warning"; exit 1; }
          rm -f "$skills/.plan-and-track-pruned"
          # B) Manifest is a symlink to an external file: the guard must refuse,
          #    never rewrite through the link.
          extm="$RUNNER_TEMP/ext-manifest"; echo EXTERNAL > "$extm"
          rm -f "$manifest"; ln -s "$extm" "$manifest"
          ./install.sh claude >/dev/null 2>"$RUNNER_TEMP/guardB.err" || true
          grep -qx EXTERNAL "$extm" || { echo "FAIL: external manifest overwritten"; exit 1; }
          grep -q 'is a symlink' "$RUNNER_TEMP/guardB.err" || { echo "FAIL: no manifest-symlink warning"; exit 1; }
          echo "OK: symlinked attic and manifest refused; external content untouched"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tooling versions
        shell: powershell
        run: $PSVersionTable.PSVersion; node --version
      - name: Install twice (idempotent) into a scratch USERPROFILE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          .\install.ps1 all
          # install.ps1 reports via Write-Host (Information stream); 6>&1 folds
          # that into the pipeline so Out-String can capture it for the assertion.
          $out = (.\install.ps1 all 6>&1 | Out-String)
          Write-Host $out
          if ($out -notmatch 'digest hook\s+-- already present') {
            throw "digest hook not detected as already present on re-run"
          }
      - name: Assert layout, defaults, and hook wiring
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home"
          $H = $env:USERPROFILE
          $need = @(
            "$H\.claude\scripts\core-rules-digest.js",
            "$H\.claude\scripts\gateguard.js",
            "$H\.claude\scripts\git-guard.js",
            "$H\.claude\scripts\delivery-gate.js",
            "$H\.claude\scripts\suggest-compact.js",
            "$H\.claude\scripts\plan-gate.js",
            "$H\.codex\scripts\core-rules-digest.js",
            "$H\.codex\scripts\git-guard.js",
            "$H\.codex\scripts\plan-gate.js",
            "$H\.copilot\scripts\core-rules-digest.js",
            "$H\.copilot\scripts\git-guard.js",
            "$H\.claude\CLAUDE.md", "$H\.codex\AGENTS.md",
            "$H\.copilot\copilot-instructions.md"
          )
          foreach ($f in $need) { if (-not (Test-Path -LiteralPath $f)) { throw "missing $f" } }
          $s = Get-Content -Raw "$H\.claude\settings.json" | ConvertFrom-Json
          if ($s.model -ne 'opusplan') { throw "model != opusplan" }
          if ($s.outputStyle -ne 'Concise') { throw "outputStyle != Concise" }
          if ($s.switchModelsOnFlag -ne $true) { throw "switchModelsOnFlag != true" }
          if ($s.enableArtifact -ne $false) { throw "enableArtifact != false" }
          function Assert-BarePermissionPosture($h) {
            $j = Get-Content -Raw (Join-Path $h '.claude\settings.json') | ConvertFrom-Json
            $dm = $null
            if ($j.PSObject.Properties.Name -contains 'permissions' -and $j.permissions.PSObject.Properties.Name -contains 'defaultMode') { $dm = $j.permissions.defaultMode }
            $skip = $null
            if ($j.PSObject.Properties.Name -contains 'skipDangerousModePermissionPrompt') { $skip = $j.skipDangerousModePermissionPrompt }
            $plugin = $null
            if ($j.PSObject.Properties.Name -contains 'enabledPlugins' -and $j.enabledPlugins.PSObject.Properties.Name -contains 'frontend-design@claude-plugins-official') { $plugin = $j.enabledPlugins.'frontend-design@claude-plugins-official' }
            if ($null -ne $dm -or $null -ne $skip -or $plugin -ne $false) {
              throw "bare install permission posture violated (defaultMode=$dm skip=$skip plugin=$plugin)"
            }
          }
          Assert-BarePermissionPosture $H
          $c = (Get-Content -Raw "$H\.copilot\settings.json" | ConvertFrom-Json).model
          if ($c -ne 'auto') { throw "copilot model != auto" }
          if ((Get-Content -Raw "$H\.codex\config.toml") -notmatch 'plan_mode_reasoning_effort = "xhigh"') { throw "codex effort missing" }
          if ((Get-Content -Raw "$H\.claude\CLAUDE.md") -notmatch 'agent-plan-and-track:begin') { throw "managed block missing" }
          if (-not (Test-Path -LiteralPath "$H\.claude\skills\skill-comply\SKILL.md")) { throw "Claude skill-comply missing" }
          if (-not (Test-Path -LiteralPath "$H\.agents\skills\skill-comply\SKILL.md")) { throw "Codex skill-comply missing" }
          if (Test-Path -LiteralPath "$H\.copilot\skills\skill-comply") { throw "Copilot unexpectedly installed skill-comply" }
          # No unresolved placeholder leaked into any installed config.
          $leak = Get-ChildItem -Recurse -File "$H\.claude","$H\.codex","$H\.copilot" |
                  Select-String -SimpleMatch '__SCRIPTS__' -List
          if ($leak) { throw "__SCRIPTS__ placeholder leaked into installed files" }
          # Digest hook command points at a script that exists, merged exactly once.
          $cmd = $s.hooks.UserPromptSubmit[0].hooks[0].command
          if ($cmd -notmatch 'core-rules-digest\.js') { throw "digest command missing" }
          $baked = ($cmd -replace '^node "([^"]+)".*', '$1')
          if (-not (Test-Path -LiteralPath $baked)) { throw "baked hook path does not exist: $baked" }
          # Only the digest hook command references the digest script, so a raw
          # string count of 1 proves it was merged exactly once (no double-merge).
          $raw = Get-Content -Raw "$H\.claude\settings.json"
          $n = ([regex]::Matches($raw, 'core-rules-digest')).Count
          if ($n -ne 1) { throw "expected 1 digest hook, found $n" }
          function Assert-CodexPlanGate {
            $codexRaw = Get-Content -Raw "$H\.codex\hooks.json"
            $codexHooks = $codexRaw | ConvertFrom-Json
            $sessionStart = @($codexHooks.hooks.SessionStart | Where-Object { $_.matcher -eq 'startup|resume' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js.*--session-start' }).Count
            $applyPre = @($codexHooks.hooks.PreToolUse | Where-Object { $_.matcher -eq 'apply_patch' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js.*--pre' }).Count
            $bashPre = @($codexHooks.hooks.PreToolUse | Where-Object { $_.matcher -eq 'Bash' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js.*--pre' }).Count
            $applyPost = @($codexHooks.hooks.PostToolUse | Where-Object { $_.matcher -eq 'apply_patch' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js.*--post' }).Count
            $total = ([regex]::Matches($codexRaw, 'plan-gate\.js')).Count
            if ($sessionStart -ne 1 -or $applyPre -ne 1 -or $bashPre -ne 1 -or $applyPost -ne 1 -or $total -ne 4) {
              throw "Codex plan-gate entries session-start=$sessionStart apply-pre=$applyPre bash-pre=$bashPre apply-post=$applyPost total=$total"
            }
          }
          Assert-CodexPlanGate
          foreach ($missing in @('session-start', 'apply-pre', 'bash-pre', 'apply-post')) {
            $codexHooks = Get-Content -Raw "$H\.codex\hooks.json" | ConvertFrom-Json
            if ($missing -eq 'session-start') {
              $codexHooks.hooks.SessionStart = @($codexHooks.hooks.SessionStart | Where-Object {
                -not ($_.matcher -eq 'startup|resume' -and @($_.hooks | Where-Object { $_.command -match 'plan-gate\.js.*--session-start' }).Count -gt 0)
              })
            } elseif ($missing -eq 'apply-post') {
              $codexHooks.hooks.PostToolUse = @($codexHooks.hooks.PostToolUse | Where-Object {
                -not ($_.matcher -eq 'apply_patch' -and @($_.hooks | Where-Object { $_.command -match 'plan-gate\.js.*--post' }).Count -gt 0)
              })
            } else {
              $matcher = if ($missing -eq 'apply-pre') { 'apply_patch' } else { 'Bash' }
              $codexHooks.hooks.PreToolUse = @($codexHooks.hooks.PreToolUse | Where-Object {
                -not ($_.matcher -eq $matcher -and @($_.hooks | Where-Object { $_.command -match 'plan-gate\.js.*--pre' }).Count -gt 0)
              })
            }
            [System.IO.File]::WriteAllText("$H\.codex\hooks.json", ($codexHooks | ConvertTo-Json -Depth 16), [System.Text.UTF8Encoding]::new($false))
            $repairOut = (.\install.ps1 codex 6>&1 | Out-String)
            if ($repairOut -notmatch 'plan-gate hook\s+-> repaired') { throw "Codex installer did not report $missing repair" }
            Assert-CodexPlanGate
          }
          $idempotentOut = (.\install.ps1 codex 6>&1 | Out-String)
          if ($idempotentOut -notmatch 'plan-gate hook\s+-- already present') { throw "Codex plan-gate entries not idempotent" }
          Assert-CodexPlanGate
          # Claude plan-gate: two additive PreToolUse entries on the same command
          # (Skill|Edit|Write|MultiEdit for the stamp/scope/lint gates, Bash for
          # the mutation gate), each checked and repaired per entry like the
          # Codex entries above.
          $claudeSettings = Get-Content -Raw "$H\.claude\settings.json" | ConvertFrom-Json
          $stampCount = @($claudeSettings.hooks.PreToolUse | Where-Object { $_.matcher -eq 'Skill|Edit|Write|MultiEdit' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js' }).Count
          if ($stampCount -ne 1) { throw "expected 1 Claude plan-gate stamp PreToolUse entry, found $stampCount" }
          $bashCount = @($claudeSettings.hooks.PreToolUse | Where-Object { $_.matcher -eq 'Bash' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js' }).Count
          if ($bashCount -ne 1) { throw "expected 1 Claude plan-gate Bash PreToolUse entry, found $bashCount" }
          $claudeSettings.hooks.PreToolUse = @($claudeSettings.hooks.PreToolUse | Where-Object { $_.matcher -ne 'Bash' })
          [System.IO.File]::WriteAllText("$H\.claude\settings.json", ($claudeSettings | ConvertTo-Json -Depth 16), [System.Text.UTF8Encoding]::new($false))
          .\install.ps1 claude | Out-Null
          $claudeSettings = Get-Content -Raw "$H\.claude\settings.json" | ConvertFrom-Json
          $hasPlanBash = @($claudeSettings.hooks.PreToolUse | Where-Object { $_.matcher -eq 'Bash' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'plan-gate\.js' }).Count -gt 0
          if (-not $hasPlanBash) { throw "Claude installer did not re-add the deleted plan-gate Bash entry" }
          # The deletion above removed every Bash-matcher PreToolUse entry, which
          # also wiped git-guard's entry (it shares the Bash matcher). Assert the
          # reinstall restored it too.
          $hasGitGuardBash = @($claudeSettings.hooks.PreToolUse | Where-Object { $_.matcher -eq 'Bash' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'git-guard\.js' }).Count -gt 0
          if (-not $hasGitGuardBash) { throw "Claude installer did not re-add the deleted git-guard Bash entry" }
          # git-guard's Codex PreToolUse entry: matcher Bash, command pointing at
          # the installed git-guard.js (proves the wiring actually rendered, not
          # just that the script file exists).
          $codexHooks = Get-Content -Raw "$H\.codex\hooks.json" | ConvertFrom-Json
          $codexGitGuardCmds = @($codexHooks.hooks.PreToolUse | Where-Object { $_.matcher -eq 'Bash' } | ForEach-Object { $_.hooks } | ForEach-Object { $_ } | Where-Object { $_.command -match 'git-guard\.js' })
          if ($codexGitGuardCmds.Count -ne 1) { throw "expected 1 Codex git-guard Bash PreToolUse entry, found $($codexGitGuardCmds.Count)" }
          $codexGitGuardPath = ($codexGitGuardCmds[0].command -replace '^node "([^"]+)".*', '$1')
          if (-not (Test-Path -LiteralPath $codexGitGuardPath)) { throw "Codex git-guard command does not point at an installed script: $codexGitGuardPath" }
          # git-guard's Copilot rendered file: preToolUse entry, matcher, and the
          # substituted script path with no leftover __SCRIPTS__ placeholder.
          $ggCopilot = "$H\.copilot\hooks\pretooluse-git-guard.json"
          if (-not (Test-Path -LiteralPath $ggCopilot)) { throw "missing $ggCopilot" }
          $ggCopilotJson = Get-Content -Raw $ggCopilot | ConvertFrom-Json
          $ggCopilotEntries = @($ggCopilotJson.hooks.preToolUse | Where-Object { $_.matcher -eq 'bash|powershell' -and $_.bash -match 'git-guard\.js' })
          if ($ggCopilotEntries.Count -ne 1) { throw "expected 1 Copilot git-guard preToolUse entry, found $($ggCopilotEntries.Count)" }
          $ggBashCmd = $ggCopilotJson.hooks.preToolUse[0].bash
          if ($ggBashCmd -match '__SCRIPTS__') { throw "Copilot git-guard file leaked __SCRIPTS__ placeholder" }
          $ggPath = ($ggBashCmd -replace '^node "([^"]+)".*', '$1')
          if (-not (Test-Path -LiteralPath $ggPath)) { throw "Copilot git-guard command does not point at an installed script: $ggPath" }
          # Codex TOML agents: one rendered file per agents/*.md source.
          $agentMdCount = (Get-ChildItem 'agents\*.md').Count
          $agentTomlCount = (Get-ChildItem "$H\.codex\agents\*.toml").Count
          if ($agentTomlCount -ne $agentMdCount) { throw "expected $agentMdCount Codex agent TOML files, found $agentTomlCount" }
          # Each rendered TOML must actually parse and carry exactly the expected
          # keys and source-tier-derived model/effort pair (existence/count alone
          # doesn't prove the renderer emitted valid or complete output).
          $validatorLines = @(
            'import glob, os, sys, tomllib',
            'expected_keys = {"name", "description", "model", "model_reasoning_effort", "sandbox_mode", "developer_instructions"}',
            'expected_agents = {"architect-reviewer": ("gpt-5.6-sol", "high"), "debugger": ("gpt-5.6-terra", "high"), "executor": ("gpt-5.6-terra", "high"), "fable-advisor": ("gpt-5.6-sol", "high"), "mechanic": ("gpt-5.6-luna", "medium"), "planner": ("gpt-5.6-sol", "xhigh"), "researcher": ("gpt-5.6-terra", "high"), "security-auditor": ("gpt-5.6-sol", "high")}',
            'files = sorted(glob.glob(os.path.join(sys.argv[1], "*.toml")))',
            'assert files, "no Codex agent TOML files found"',
            'parsed = {os.path.splitext(os.path.basename(f))[0]: tomllib.load(open(f, "rb")) for f in files}',
            'bad_keys = [(name, sorted(agent.keys())) for name, agent in parsed.items() if set(agent.keys()) != expected_keys]',
            'assert not bad_keys, f"bad TOML key sets: {bad_keys}"',
            'rendered = {name: (agent["model"], agent["model_reasoning_effort"]) for name, agent in parsed.items()}',
            'assert rendered == expected_agents, f"bad Codex model/effort mappings: {rendered}"',
            'print(f"OK: validated model/effort mappings for {len(parsed)} rendered Codex agents")'
          )
          $validatorPath = Join-Path $env:RUNNER_TEMP 'validate_codex_toml.py'
          Set-Content -Path $validatorPath -Value $validatorLines -Encoding utf8
          python $validatorPath "$H\.codex\agents"
          if ($LASTEXITCODE -ne 0) { throw "Codex TOML validation failed" }
          # A valid user-owned nested [features] table must survive unchanged.
          # The root plan-mode effort is pre-set so a successful Codex install
          # leaves this config byte-for-byte intact while still rendering every role.
          $userConfigHome = "$env:RUNNER_TEMP\scratch-home-codex-user-features"
          New-Item -ItemType Directory -Force -Path "$userConfigHome\.codex" | Out-Null
          $userConfig = "$userConfigHome\.codex\config.toml"
          [System.IO.File]::WriteAllText($userConfig, "plan_mode_reasoning_effort = `"xhigh`"`n`n[features.multi_agent_v2]`nhide_spawn_agent_metadata = false`ntool_namespace = `"agents`"`n", [System.Text.UTF8Encoding]::new($false))
          Copy-Item -LiteralPath $userConfig -Destination "$env:RUNNER_TEMP\codex-user-features-before.toml" -Force
          $env:USERPROFILE = $userConfigHome
          .\install.ps1 codex | Out-Null
          if ((Get-FileHash "$env:RUNNER_TEMP\codex-user-features-before.toml").Hash -ne (Get-FileHash $userConfig).Hash) { throw "Codex installer changed a user-owned feature table" }
          $userConfigCheck = 'import sys, tomllib; config=tomllib.load(open(sys.argv[1], "rb")); features=config["features"]["multi_agent_v2"]; expected={"hide_spawn_agent_metadata": False, "tool_namespace": "agents"}; assert features == expected, f"Codex user feature table changed: {features}"; print("OK: Codex preserves a user-owned nested feature table")'
          $userConfigCheckPath = Join-Path $env:RUNNER_TEMP 'validate_codex_user_feature_table.py'
          [System.IO.File]::WriteAllText($userConfigCheckPath, $userConfigCheck, [System.Text.UTF8Encoding]::new($false))
          python $userConfigCheckPath $userConfig
          if ($LASTEXITCODE -ne 0) { throw "Codex user feature-table validation failed" }
          $userConfigAgentCount = (Get-ChildItem "$userConfigHome\.codex\agents\*.toml").Count
          if ($userConfigAgentCount -ne $agentMdCount) { throw "expected $agentMdCount Codex agent TOML files in user-config home, found $userConfigAgentCount" }
          python $validatorPath "$userConfigHome\.codex\agents"
          if ($LASTEXITCODE -ne 0) { throw "Codex TOML validation failed in user-config home" }
          $env:USERPROFILE = $H
          # Copilot agents: one rendered file per agents/*.md source.
          $copilotAgentCount = (Get-ChildItem "$H\.copilot\agents\*.agent.md").Count
          if ($copilotAgentCount -ne $agentMdCount) { throw "expected $agentMdCount Copilot agent files, found $copilotAgentCount" }
          # Mapping spot-check on the rendered executor agent: expected tool
          # aliases, fenced frontmatter, and neither Claude's model nor effort key
          # (the Copilot render deliberately omits both).
          $executorAgent = "$H\.copilot\agents\executor.agent.md"
          $executorContent = Get-Content -Raw $executorAgent
          if ($executorContent -notmatch [regex]::Escape('tools: ["read", "search", "edit", "execute"]')) { throw "executor.agent.md missing expected tools mapping" }
          $firstLine = (Get-Content $executorAgent -TotalCount 1)
          if ($firstLine -ne '---') { throw "executor.agent.md does not start with a --- fence" }
          if ($executorContent -match '(?m)^model:') { throw "executor.agent.md unexpectedly carries a model: line" }
          if ($executorContent -match '(?m)^effort:') { throw "executor.agent.md unexpectedly carries an effort: line" }
      - name: Permission posture is opt-in only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Duplicated verbatim from the "Assert layout, defaults, and hook wiring"
          # step: each run: block is its own process, so a function defined there
          # does not exist here. Edit both copies together.
          function Assert-BarePermissionPosture($h) {
            $j = Get-Content -Raw (Join-Path $h '.claude\settings.json') | ConvertFrom-Json
            $dm = $null
            if ($j.PSObject.Properties.Name -contains 'permissions' -and $j.permissions.PSObject.Properties.Name -contains 'defaultMode') { $dm = $j.permissions.defaultMode }
            $skip = $null
            if ($j.PSObject.Properties.Name -contains 'skipDangerousModePermissionPrompt') { $skip = $j.skipDangerousModePermissionPrompt }
            $plugin = $null
            if ($j.PSObject.Properties.Name -contains 'enabledPlugins' -and $j.enabledPlugins.PSObject.Properties.Name -contains 'frontend-design@claude-plugins-official') { $plugin = $j.enabledPlugins.'frontend-design@claude-plugins-official' }
            if ($null -ne $dm -or $null -ne $skip -or $plugin -ne $false) {
              throw "bare install permission posture violated (defaultMode=$dm skip=$skip plugin=$plugin)"
            }
          }
          # 1. Opt-in: with the variable set, the Claude target must set all three keys.
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-bypass-optin"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          $env:PT_BYPASS_PERMISSIONS = '1'
          .\install.ps1 claude | Out-Null
          Remove-Item Env:PT_BYPASS_PERMISSIONS -ErrorAction SilentlyContinue
          $s = Get-Content -Raw "$env:USERPROFILE\.claude\settings.json" | ConvertFrom-Json
          if ($s.permissions.defaultMode -ne 'bypassPermissions') { throw "opt-in install did not set defaultMode" }
          if ($s.skipDangerousModePermissionPrompt -ne $true) { throw "opt-in install did not set skip flag" }
          if ($s.enabledPlugins.'frontend-design@claude-plugins-official' -ne $false) { throw "opt-in install did not disable the plugin" }
          # All three are re-asserted over conflicting existing values, not merely
          # inserted into an empty file. Checked in the same home because the
          # assertions above start from empty, which a set-if-absent implementation
          # would also satisfy.
          Set-Content -Path "$env:USERPROFILE\.claude\settings.json" -Value '{"permissions":{"defaultMode":"plan"},"skipDangerousModePermissionPrompt":false,"enabledPlugins":{"frontend-design@claude-plugins-official":true}}'
          $env:PT_BYPASS_PERMISSIONS = '1'
          .\install.ps1 claude | Out-Null
          Remove-Item Env:PT_BYPASS_PERMISSIONS -ErrorAction SilentlyContinue
          $s = Get-Content -Raw "$env:USERPROFILE\.claude\settings.json" | ConvertFrom-Json
          if ($s.permissions.defaultMode -ne 'bypassPermissions') { throw "opt-in install did not overwrite a conflicting defaultMode" }
          if ($s.skipDangerousModePermissionPrompt -ne $true) { throw "opt-in install did not overwrite a conflicting skip flag" }
          if ($s.enabledPlugins.'frontend-design@claude-plugins-official' -ne $false) { throw "opt-in install did not overwrite a conflicting plugin value" }
          # 2. Survival: a pre-existing stricter posture and an unrelated plugin
          # entry must survive a BARE install untouched, aside from the plugin disable.
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-bypass-survival"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.claude" | Out-Null
          Set-Content -Path "$env:USERPROFILE\.claude\settings.json" -Value '{"permissions":{"defaultMode":"default"},"enabledPlugins":{"life@laerdal":true}}'
          .\install.ps1 claude | Out-Null
          $s = Get-Content -Raw "$env:USERPROFILE\.claude\settings.json" | ConvertFrom-Json
          if ($s.permissions.defaultMode -ne 'default') { throw "bare install altered a pre-existing defaultMode" }
          if ($s.PSObject.Properties.Name -contains 'skipDangerousModePermissionPrompt') { throw "bare install added the skip flag" }
          if ($s.enabledPlugins.'frontend-design@claude-plugins-official' -ne $false) { throw "bare install did not disable the plugin" }
          if ($s.enabledPlugins.'life@laerdal' -ne $true) { throw "bare install disturbed an unrelated plugin entry" }
          # 3. Null intermediates: a settings file whose permissions/enabledPlugins
          # are JSON null must not abort the install. jq's setpath replaces a null
          # with an object, and Set-JsonPath has to match that.
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-bypass-null"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.claude" | Out-Null
          Set-Content -Path "$env:USERPROFILE\.claude\settings.json" -Value '{"permissions":null,"enabledPlugins":null}'
          .\install.ps1 claude | Out-Null
          Assert-BarePermissionPosture $env:USERPROFILE
          # 4. Negative control: prove part A's assertion is not vacuous by running
          # it against a home whose settings deliberately already carry both bypass keys.
          $env:USERPROFILE = "$env:RUNNER_TEMP\scratch-home-bypass-negctrl"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.claude" | Out-Null
          Set-Content -Path "$env:USERPROFILE\.claude\settings.json" -Value '{"permissions":{"defaultMode":"bypassPermissions"},"skipDangerousModePermissionPrompt":true,"enabledPlugins":{"frontend-design@claude-plugins-official":false}}'
          $violated = $false
          try { Assert-BarePermissionPosture $env:USERPROFILE } catch { $violated = $true }
          if (-not $violated) { throw "Assert-BarePermissionPosture passed against a fixture that deliberately carries both bypass keys" }
          Write-Host "OK: the bare-posture assertion rejects a settings file carrying the bypass keys"
      - name: PT_KEEP_MODEL keeps an existing choice
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # 1. Opt-out: PT_KEEP_MODEL=1 must leave a pre-existing managed value alone.
